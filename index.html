<style>
  :root {
    color-scheme: dark;
    --ink: #0d0d0e;
    --paper: #f2f2ef;
    --dim: rgba(242, 242, 239, 0.6);
    --faint: rgba(242, 242, 239, 0.34);
    --line: rgba(242, 242, 239, 0.12);
    --glass: rgba(24, 24, 26, 0.56);
    --sans: "Geist", "Helvetica Neue", Arial, system-ui, sans-serif;
    --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  [hidden] { display: none !important; }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--ink);
    color: var(--paper);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: none; }
  #gl.touch, body.is-open #gl { cursor: default; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  :focus-visible { outline: 1.5px solid var(--paper); outline-offset: 3px; border-radius: 999px; }

  /* ---------- glass material (CSS approximation for UI chrome) ---------- */
  .glass {
    background: var(--glass);
    -webkit-backdrop-filter: blur(30px) saturate(1.7);
    backdrop-filter: blur(30px) saturate(1.7);
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.16),
      inset 0 -1px 0 rgba(255, 255, 255, 0.04),
      0 18px 50px rgba(0, 0, 0, 0.42);
  }

  /* ---------- HUD ---------- */
  .hud {
    position: fixed; left: 0; right: 0; z-index: 7;
    display: flex; justify-content: space-between; align-items: center; gap: 16px;
    padding-inline: max(16px, 3vw);
    pointer-events: none;
  }
  .hud > * { pointer-events: auto; }
  .mark, .hud-bottom { transition: opacity .3s; }
  body.is-open .mark, body.is-open .hud-bottom, body.is-index .hud-bottom { opacity: 0; pointer-events: none; }
  .hud-top { top: 0; padding-top: calc(env(safe-area-inset-top, 0px) + 20px); }
  .hud-bottom { bottom: 0; align-items: flex-end; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); }
  .hud-top { transition: opacity .3s; }
  body.is-index .hud-top, body.is-index .hud-bottom { opacity: 0; pointer-events: none; }

  .mark { font-weight: 600; font-size: 18px; letter-spacing: -0.03em; }

  /* nav: plain words; the drop itself becomes their highlight */
  .nav { display: flex; gap: 4px; }
  .nav button {
    padding: 8px 16px; border-radius: 999px;
    font-size: 14px; font-weight: 500; letter-spacing: -0.01em;
    color: rgba(242, 242, 239, 0.72);
    transition: color .25s;
  }
  .nav button:hover, .nav button.lit { color: var(--paper); }
  @media (pointer: coarse) {
    .nav {
      padding: 4px; border-radius: 999px;
      background: var(--glass);
      -webkit-backdrop-filter: blur(30px) saturate(1.7); backdrop-filter: blur(30px) saturate(1.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16), 0 12px 30px rgba(0, 0, 0, 0.4);
    }
    .nav button { color: var(--paper); }
  }
  .hint { font-size: 13px; color: var(--dim); max-width: 36ch; margin: 0; letter-spacing: -0.005em; }
  .readout {
    font-family: var(--mono); font-size: 11px; color: var(--faint);
    font-variant-numeric: tabular-nums; letter-spacing: 0.06em; white-space: nowrap; margin: 0;
  }
  .readout em { font-style: normal; color: var(--dim); }


  /* ---------- case study sheet ---------- */
  #sheet {
    position: fixed; z-index: 8;
    top: calc(env(safe-area-inset-top, 0px) + 16px);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
    right: 16px;
    width: min(460px, calc(100% - 32px));
    overflow: hidden;
    border-radius: 30px;
    display: flex; flex-direction: column;
    animation: rise .5s cubic-bezier(.2, .9, .25, 1);
  }
  .sheet-scroll {
    flex: 1 1 auto; min-height: 0; overflow-y: auto;
    padding: 28px 30px 32px;
    display: flex; flex-direction: column; gap: 22px;
  }
  @keyframes rise { from { transform: translateY(18px) scale(.98); opacity: 0; } }
  .sheet-head { display: flex; align-items: center; min-height: 34px; padding-right: 48px; }
  .kind { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); }
  .close {
    position: absolute; z-index: 2; top: 24px; right: 26px;
    width: 34px; height: 34px; border-radius: 50%;
    display: grid; place-items: center;
    background: rgba(48, 48, 52, 0.72);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14), 0 4px 14px rgba(0, 0, 0, 0.35);
    font-size: 18px; line-height: 1;
    transition: background-color .2s;
  }
  .close:hover { background: rgba(70, 70, 76, 0.8); }
  #sheet h2 {
    font-weight: 600; font-size: clamp(46px, 6vw, 68px);
    line-height: 0.92; letter-spacing: -0.05em;
    margin: 0; text-wrap: balance;
  }
  .lede { font-size: 20px; font-weight: 500; line-height: 1.3; letter-spacing: -0.02em; margin: 0; text-wrap: pretty; }
  .body { font-size: 15px; color: var(--dim); margin: 0; text-wrap: pretty; }
  .facts { display: grid; gap: 0; margin: 0; }
  .facts > div { display: grid; grid-template-columns: 96px 1fr; gap: 14px; padding-block: 13px; border-top: 1px solid var(--line); }
  .facts dt { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); padding-top: 3px; }
  .facts dd { margin: 0; font-size: 14.5px; }
  .facts ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips span { font-family: var(--mono); font-size: 11.5px; padding: 4px 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.07); }
  .status { display: inline-flex; align-items: center; gap: 8px; }
  .status i { width: 9px; height: 9px; border-radius: 50%; background: var(--dot, var(--paper)); }
  .visit {
    align-self: flex-start; text-decoration: none; color: var(--ink); background: var(--paper);
    font-size: 14px; font-weight: 600; letter-spacing: -0.01em;
    padding: 10px 18px; border-radius: 999px;
    transition: transform .2s;
  }
  .visit:hover { transform: translateY(-1px); }
  .copyrow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .copyrow code { font-family: var(--mono); font-size: 13.5px; user-select: all; }
  .copyrow button { font-size: 12.5px; font-weight: 500; padding: 4px 11px; border-radius: 999px; background: rgba(255, 255, 255, 0.1); }
  .motto { font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.1em; color: var(--faint); margin: 0; }

  /* ---------- index ---------- */
  #index {
    position: fixed; inset: 0; z-index: 6;
    background: rgba(13, 13, 14, 0.97);
    overflow-y: auto;
    will-change: clip-path;
    contain: paint;
    padding-inline: max(16px, 3vw);
    padding-block: calc(env(safe-area-inset-top, 0px) + 40px) 150px;
    clip-path: circle(0px at var(--ox, 90%) var(--oy, 4%));
    transition: clip-path .66s cubic-bezier(.55, 0, .25, 1);
  }
  #index.shown { clip-path: circle(var(--rmax, 200vmax) at var(--ox, 90%) var(--oy, 4%)); }
  #index .ik { display: inline-flex; align-items: center; gap: 10px; }
  #index .ik i { width: 9px; height: 9px; border-radius: 50%; background: var(--dot); }

  #btnBack {
    position: fixed; z-index: 9; left: 50%;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
    display: flex; align-items: center; gap: 10px;
    padding: 12px 26px; border-radius: 999px;
    font-size: 14px; font-weight: 500; letter-spacing: -0.01em;
    transform: translateX(-50%);
    transition: transform .45s cubic-bezier(.3, 1.6, .45, 1), opacity .25s ease .5s;
    animation: pop .6s cubic-bezier(.3, 1.6, .45, 1) .25s both;
  }
  #btnBack:hover { transform: translateX(-50%) scale(1.07); }
  #btnBack.sink { transform: translateX(-50%) scale(.82); opacity: 0; pointer-events: none; }
  @keyframes pop { from { transform: translateX(-50%) scale(.4); opacity: 0; } }
  #index ol { list-style: none; margin: 0; padding: 0; }
  #index li { border-top: 1px solid var(--line); }
  #index button {
    width: 100%; text-align: left;
    display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 24px;
    padding-block: 14px 16px;
  }
  #index .it { font-weight: 600; font-size: clamp(34px, 6.4vw, 72px); line-height: 1; letter-spacing: -0.05em; transition: transform .35s cubic-bezier(.2, .9, .25, 1); }
  #index button:hover .it, #index button:focus-visible .it { transform: translateX(12px); }
  #index .ik { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); }

  #nogl { position: fixed; inset: 0; display: grid; place-items: center; padding-inline: 16px; text-align: center; color: var(--dim); }

  @media (max-width: 700px) {
    #sheet {
      top: auto; left: 10px; right: 10px; bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
      width: auto; max-height: 64%;
      border-radius: 28px;
    }
    .sheet-scroll { padding: 22px 22px 26px; gap: 18px; }
    .close { top: 18px; right: 18px; }
    .facts > div { grid-template-columns: 1fr; gap: 6px; }
    .hint { max-width: 24ch; }
    .mark { font-size: 17px; }
  }
  @media (prefers-reduced-motion: reduce) {
    #sheet { animation: none; }
    #index .it { transition: none; }
    #index { transition: none; }
    #btnBack { animation: none; }
  }
</style>
</head>

const sheet = $("#sheet"), indexEl = $("#index"), btnIndex = $("#btnIndex"), btnAbout = $("#btnAbout");
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const coarse = matchMedia("(pointer: coarse)").matches;
if (coarse) { cvs.classList.add("touch"); hint.textContent = "Drag the drop. Pinch to resize. Tap it to open."; }

/* ============================== FIELD ============================== */
let W = innerWidth, H = innerHeight, rows = [];
const field = document.createElement("canvas");
const fctx = field.getContext("2d");

function rng(seedStr) {
  let h = 1779033703 ^ seedStr.length;
  for (let i = 0; i < seedStr.length; i++) { h = Math.imul(h ^ seedStr.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
  let a = h >>> 0;
  return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function rr(c, x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
function spacing(c, v) { if ("letterSpacing" in c) c.letterSpacing = v; }

/* ---------- small procedural visuals, one per project ---------- */
const G = {
  roost(c, x, y, w, h, R) {
    c.fillStyle = "#17140d"; c.fillRect(x, y, w, h);
    const g = c.createRadialGradient(x + w * 0.6, y + h * 0.4, 0, x + w * 0.6, y + h * 0.4, w * 0.6);
    g.addColorStop(0, "rgba(224,166,74,.35)"); g.addColorStop(1, "rgba(224,166,74,0)"); c.fillStyle = g; c.fillRect(x, y, w, h);
    const ch = h * 0.86, cw = ch * 0.64;
    const card = (cx, cy, ang, fill, mod) => {
      c.save(); c.translate(cx, cy); c.rotate(ang);
      rr(c, -cw / 2, -ch / 2, cw, ch, cw * 0.1); c.fillStyle = fill; c.fill();
      const n = 11, q = cw * 0.7, m = q / n, qx = -q / 2, qy = -ch / 2 + cw * 0.16;
      c.fillStyle = mod;
      for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
        const inF = (i < 4 && j < 4) || (i > n - 5 && j < 4) || (i < 4 && j > n - 5);
        if (inF ? (i % 3 === 0 || j % 3 === 0 || (i % 3 === 1 && j % 3 === 1)) && !(i === 3 || j === 3 || i === n - 4 || j === n - 4) : R() < 0.46) c.fillRect(qx + i * m, qy + j * m, m + 0.2, m + 0.2);
      }
      c.textAlign = "center"; c.font = `700 ${cw * 0.13}px ${FONT}`; spacing(c, "0.14em");
      c.fillText("ROOST", 0, qy + q + cw * 0.26); spacing(c, "0px"); c.textAlign = "left";
      c.restore();
    };
    card(x + w * 0.38, y + h * 0.53, -0.14, "#1b1812", "#e0a64a");
    card(x + w * 0.62, y + h * 0.5, 0.1, "#e0e9d4", "#1f2a1c");
  },
  cenek(c, x, y, w, h, R) {
    c.fillStyle = "#0e1214"; c.fillRect(x, y, w, h);
    const gap = Math.max(1.5, h * 0.05), fw = (w - gap * 4) / 3, fh = (h - gap * 3) / 2;
    const kinds = ["drone", "pitch", "dusk", "roofs", "rink", "reel"];
    kinds.forEach((k, i) => {
      const fx = x + gap + (i % 3) * (fw + gap), fy = y + gap + Math.floor(i / 3) * (fh + gap);
      c.save(); rr(c, fx, fy, fw, fh, h * 0.04); c.clip();
      if (k === "drone" || k === "roofs") {
        c.fillStyle = k === "drone" ? "#3e4b3c" : "#48433c"; c.fillRect(fx, fy, fw, fh);
        for (let j = 0; j < 7; j++) { c.fillStyle = ["#8f5a48", "#aba59b", "#5f6c74", "#7e4c3c"][j % 4]; c.fillRect(fx + R() * fw, fy + R() * fh, fw * (0.14 + R() * 0.16), fh * (0.16 + R() * 0.2)); }
      } else if (k === "pitch" || k === "rink") {
        c.fillStyle = k === "pitch" ? "#35573f" : "#cbd8de"; c.fillRect(fx, fy, fw, fh);
        c.strokeStyle = k === "pitch" ? "rgba(242,242,239,.75)" : "rgba(190,60,60,.7)"; c.lineWidth = Math.max(0.6, h * 0.012);
        c.strokeRect(fx + fw * 0.1, fy + fh * 0.14, fw * 0.8, fh * 0.72);
        c.beginPath(); c.moveTo(fx + fw / 2, fy + fh * 0.14); c.lineTo(fx + fw / 2, fy + fh * 0.86); c.stroke();
      } else {
        const gg = c.createLinearGradient(fx, fy, fx, fy + fh);
        gg.addColorStop(0, k === "dusk" ? "#eaa977" : "#5c7384"); gg.addColorStop(0.65, k === "dusk" ? "#6f4a5b" : "#1d2832"); gg.addColorStop(1, "#111");
        c.fillStyle = gg; c.fillRect(fx, fy, fw, fh);
        c.fillStyle = "#0b0c0d"; c.beginPath(); c.moveTo(fx, fy + fh);
        for (let j = 0; j <= 6; j++) c.lineTo(fx + (j / 6) * fw, fy + fh * (0.62 + R() * 0.18)); c.lineTo(fx + fw, fy + fh); c.fill();
      }
      c.restore();
    });
  },
  claude(c, x, y, w, h) {
    c.fillStyle = "#0a0a0a"; c.fillRect(x, y, w, h);
    c.fillStyle = "#f2f2ef"; c.font = `700 ${h * 0.46}px ${FONT}`; spacing(c, "-0.05em");
    c.fillText("claude", x + w * 0.08, y + h * 0.66); spacing(c, "0px");
  },
  games(c, x, y, w, h, R) {
    c.fillStyle = "#0e1811"; c.fillRect(x, y, w, h);
    const cols = ["#7fc796", "#e08aab", "#8aa8e0", "#e0c98a"];
    for (let i = 0; i < 9; i++) {
      const r = i === 0 ? h * 0.26 : h * (0.04 + R() * 0.09);
      const cx = x + w * (i === 0 ? 0.3 : 0.06 + R() * 0.5), cy = y + h * (i === 0 ? 0.48 : 0.12 + R() * 0.76);
      c.fillStyle = cols[i % 4]; c.beginPath(); c.arc(cx, cy, r, 0, 7); c.fill();
    }
    for (let i = 18; i >= 0; i--) {
      const t = i / 18, sx = x + w * 0.58 + t * w * 0.36, sy = y + h * 0.52 + Math.sin(t * 8) * h * 0.2;
      c.fillStyle = i === 0 ? "#f3b7cb" : (i % 2 ? "#e08aab" : "#c97796");
      c.beginPath(); c.arc(sx, sy, h * (0.09 - t * 0.05), 0, 7); c.fill();
    }
  },
  once(c, x, y, w, h, R) {
    c.fillStyle = "#10121b"; c.fillRect(x, y, w, h);
    const inks = ["#8c9ee8", "#f2f2ef", "#ec8a68", "#b7c0ee", "#7fc796"];
    c.lineCap = "round"; c.lineJoin = "round";
    for (let i = 0; i < 18; i++) {
      c.strokeStyle = hexA(inks[i % inks.length], 0.6 + R() * 0.4);
      c.lineWidth = Math.max(0.6, h * (0.012 + R() * 0.02));
      let px = x + R() * w, py = y + R() * h;
      c.beginPath(); c.moveTo(px, py);
      for (let j = 0; j < 3; j++) {
        const dx = (R() - 0.3) * w * 0.25, dy = (R() - 0.5) * h * 0.4;
        c.bezierCurveTo(px + dx * 0.3, py - h * 0.15 * R(), px + dx * 0.7, py + dy + h * 0.12 * R(), px + dx, py + dy * 0.4);
        px += dx; py += dy * 0.4;
      }
      c.stroke();
    }
  },
  blocks(c, x, y, w, h, R) {
    c.fillStyle = "#17110e"; c.fillRect(x, y, w, h);
    const rowsN = 5, cell = h / (rowsN + 0.6), colsN = Math.floor((w - cell * 0.3) / cell), ox = x + (w - colsN * cell) / 2, oy = y + cell * 0.3;
    const cols = ["#ec8a68", "#6fb8ab", "#dcb45c", "#a99ade"];
    for (let i = 0; i < colsN; i++) for (let j = 0; j < rowsN; j++) {
      rr(c, ox + i * cell + 1, oy + j * cell + 1, cell - 2, cell - 2, cell * 0.2);
      c.fillStyle = R() < 0.5 ? cols[Math.floor(R() * 4)] : "rgba(242,242,239,.06)"; c.fill();
    }
  },
  recenze(c, x, y, w, h) {
    c.fillStyle = "#15130d"; c.fillRect(x, y, w, h);
    const star = (cx, cy, r, on) => { c.beginPath(); for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, rad = k % 2 ? r * 0.45 : r; c.lineTo(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad); } c.closePath(); c.fillStyle = on ? "#d4bd70" : "rgba(242,242,239,.14)"; c.fill(); };
    [5, 4, 5].forEach((n, i) => {
      const ry = y + h * (0.24 + i * 0.28);
      for (let s = 0; s < 5; s++) star(x + w * 0.14 + s * h * 0.2, ry, h * 0.08, s < n);
      c.fillStyle = "rgba(242,242,239,.2)"; rr(c, x + w * 0.14 + h * 1.05, ry - h * 0.03, w * 0.3, h * 0.06, h * 0.03); c.fill();
    });
  },
  walldecor(c, x, y, w, h) {
    c.fillStyle = "#261d17"; c.fillRect(x, y, w, h);
    const L = [[0.08, 0.14, 0.26, 0.72], [0.4, 0.14, 0.22, 0.36], [0.4, 0.56, 0.22, 0.3], [0.68, 0.2, 0.24, 0.6]];
    const arts = [["#eab58a", "#9c4f3c"], ["#9fb8c4", "#344552"], ["#dccca3", "#6b5a3c"], ["#86a88f", "#233b2c"]];
    L.forEach(([fx, fy, fw, fh], i) => {
      const X = x + fx * w, Y = y + fy * h, FW = fw * w, FH = fh * h, m = Math.min(FW, FH) * 0.12;
      c.fillStyle = "#0e0c0a"; c.fillRect(X, Y, FW, FH);
      c.fillStyle = "#ece5d7"; c.fillRect(X + 1, Y + 1, FW - 2, FH - 2);
      const ag = c.createLinearGradient(X, Y, X + FW * 0.4, Y + FH); ag.addColorStop(0, arts[i][0]); ag.addColorStop(1, arts[i][1]);
      c.fillStyle = ag; c.fillRect(X + m, Y + m, FW - 2 * m, FH - 2 * m);
    });
  }
};

/* ---------- layout: the work flows as one block of big type, like a sentence ---------- */
function nameWidth(c, text, f) { c.font = `600 ${f}px ${FONT}`; spacing(c, "-0.05em"); const w = c.measureText(text).width; spacing(c, "0px"); return w; }
function supWidth(c, text, ms) { c.font = `500 ${ms}px ${MONO}`; spacing(c, "0.08em"); const w = c.measureText(text).width; spacing(c, "0px"); return w; }

// greedy line breaking; a name and its preview stay together unless the screen is too narrow
function flow(f, availW, split) {
  const c = fctx; c.setTransform(1, 0, 0, 1, 0, 0);
  const gap = f * 0.3, glue = f * 0.16;
  const ms = Math.max(9, Math.min(13, f * 0.1));
  const lines = [[]]; let x = 0, widest = 0;
  const push = (kind, u, w) => { lines[lines.length - 1].push({ kind, u, x, w }); x += w; };
  const newLine = () => { lines.push([]); x = 0; };
  WORK.forEach(item => {
    const nameW = nameWidth(c, item.title, f);
    const th = f * 0.66, tw = th * 1.72, dot = f * 0.17, dgap = f * 0.15;
    const u = { item, nameW, th, tw, dot, dgap, a: nameW, b: tw + dgap + dot };
    widest = Math.max(widest, u.a, u.b);
    const lead = x > 0 ? gap : 0;
    if (x + lead + u.a + glue + u.b <= availW) { x += lead; push("name", u, u.a); x += glue; push("thumb", u, u.b); return; }
    if (split && x + lead + u.a <= availW) { x += lead; push("name", u, u.a); newLine(); push("thumb", u, u.b); return; }
    if (x > 0) newLine();
    push("name", u, u.a);
    if (u.a + glue + u.b <= availW) { x += glue; push("thumb", u, u.b); } else { newLine(); push("thumb", u, u.b); }
  });
  return { lines: lines.filter(l => l.length), widest };
}

function layout() {
  const narrow = W < 700;
  const side = narrow ? 16 : Math.max(24, Math.round(W * 0.03));
  const top = narrow ? 88 : 104, bottom = narrow ? 76 : 88;
  const availW = W - side * 2, availH = H - top - bottom;
  // largest type size whose flow still fits the screen (the v7 fitText idea, applied to the whole block)
  let lo = 18, hi = Math.min(availH * 0.36, 260), best = null;
  for (let i = 0; i < 24; i++) {
    const f = (lo + hi) / 2, L = flow(f, availW, narrow);
    if (L.lines.length * f * 1.04 <= availH && L.widest <= availW) { lo = f; best = { f, L }; } else hi = f;
  }
  if (!best) best = { f: lo, L: flow(lo, availW, narrow) };
  const { f, L } = best, n = L.lines.length, cap = f * 0.71;
  const lh = Math.min(availH / n, f * 1.3), y0 = top + (availH - lh * n) / 2;
  rows = [];
  const byItem = new Map();
  L.lines.forEach((line, li) => {
    const base = y0 + li * lh + lh * 0.5 + cap * 0.5;
    const last = line[line.length - 1], used = last.x + last.w;
    let breaks = 0; line.forEach((p, i) => { if (i > 0 && p.kind === "name") breaks++; });
    const extra = availW - used, limit = li < n - 1 ? f * 1.6 : f * 0.9;
    const per = breaks > 0 && extra / breaks <= limit ? extra / breaks : 0;   // justify when the gaps stay honest
    let shift = 0;
    line.forEach((p, i) => {
      if (i > 0 && p.kind === "name") shift += per;
      const px = side + p.x + shift, u = p.u;
      let r = byItem.get(u.item);
      if (!r) { r = { item: u.item, u, f, cap, rects: [] }; byItem.set(u.item, r); rows.push(r); }
      if (p.kind === "name") {
        r.name = { x: px, base, w: u.nameW };
        r.rects.push({ x: px, y: base - cap - f * 0.16, w: p.w, h: cap + f * 0.36 });
      } else {
        r.thumb = { x: px, y: base - cap * 0.5 - u.th / 2, w: u.tw, h: u.th };
        r.dot = { x: px + u.tw + u.dgap + u.dot / 2, y: base - cap * 0.5, r: u.dot / 2 };
        r.rects.push({ x: px, y: r.thumb.y, w: u.b, h: u.th });
      }
    });
  });
  rows.forEach(r => { r.fx = r.name.x + r.name.w / 2; r.fy = r.name.base - cap * 0.5; });
}
function rowAt(x, y) { return rows.find(r => r.rects.some(q => x >= q.x - 10 && x <= q.x + q.w + 10 && y >= q.y - 10 && y <= q.y + q.h + 10)) || null; }

function drawRow(c, r) {
  const { item, f, u } = r;
  c.font = `600 ${f}px ${FONT}`; spacing(c, "-0.05em");
  c.fillStyle = "#f2f2ef";
  c.fillText(item.title, r.name.x - f * 0.03, r.name.base); spacing(c, "0px");
  const t = r.thumb, rad = t.h * 0.28;
  c.save(); rr(c, t.x, t.y, t.w, t.h, rad); c.clip();
  G[item.id](c, t.x, t.y, t.w, t.h, rng(item.id));
  c.restore();
  rr(c, t.x + 0.5, t.y + 0.5, t.w - 1, t.h - 1, rad); c.strokeStyle = "rgba(255,255,255,.12)"; c.lineWidth = 1; c.stroke();
  // status, as colour only; the case sheet spells it out
  c.fillStyle = STATUS[item.status] || "#f2f2ef"; c.beginPath(); c.arc(r.dot.x, r.dot.y, r.dot.r, 0, 7); c.fill();
}

// paints the whole surface in CSS pixels under whatever transform the context carries
function paintField(c) {
  c.fillStyle = "#0d0d0e"; c.fillRect(-1e4, -1e4, 2e4, 2e4);
  rows.forEach(r => {
    const t = r.thumb, cx = t.x + t.w / 2, cy = t.y + t.h / 2, rad = t.w * 1.4;
    const g = c.createRadialGradient(cx, cy, 0, cx, cy, rad);
    g.addColorStop(0, hexA(r.item.hue, 0.16)); g.addColorStop(1, hexA(r.item.hue, 0));
    c.fillStyle = g; c.fillRect(cx - rad, cy - rad, rad * 2, rad * 2);
  });
  rows.forEach(r => drawRow(c, r));
}

function buildField(glMax) {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const cap = Math.min(glMax || 4096, 4096);
  const k = Math.min(dpr * 2, cap / Math.max(W, H));
  field.width = Math.round(W * k); field.height = Math.round(H * k);
  fctx.setTransform(k, 0, 0, k, 0, 0);
  paintField(fctx);
}

// a sharper copy of just the region an open project shows, drawn at the zoom it's seen at
const detail = document.createElement("canvas");
let detailRect = [0, 0, 1, 1], detailOn = 0;
function renderDetail(x, y, w, h, scale) {
  detail.width = Math.max(2, Math.round(w * scale)); detail.height = Math.max(2, Math.round(h * scale));
  const c = detail.getContext("2d");
  c.setTransform(scale, 0, 0, scale, -x * scale, -y * scale);
  paintField(c);
  detailRect = [x, y, w, h];
}

/* ============================== WEBGL: the glass drop ============================== */
const gl = cvs.getContext("webgl", { antialias: false, alpha: false, premultipliedAlpha: false });
const VS = `attribute vec2 a; void main(){ gl_Position = vec4(a, 0.0, 1.0); }`;
const FS = `
precision highp float;
uniform sampler2D uSharp, uBlur, uDetail;
uniform vec4 uDRect;
uniform float uDetailOn;
uniform vec2 uView;
uniform float uDpr;
uniform vec2 uA, uB, uSrc;      // head, trailing tail, field point shown at the head
uniform vec2 uSeg;              // half-length of the head: 0 = round drop, >0 = pill
uniform float uRA, uRB, uK;     // radii and blend
uniform float uMag, uBevel, uDim;
uniform vec4 uHi0, uHi1;        // capsules around the targeted project (x0, y, x1, radius), surface px
uniform float uHiAmt, uFeather;
uniform vec2 uTexel;

vec2 toUV(vec2 p) { return vec2(p.x / uView.x, 1.0 - p.y / uView.y); }
float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
float smin(float a, float b, float k) { float h = max(k - abs(a - b), 0.0) / k; return min(a, b) - h * h * k * 0.25; }
float sdSeg(vec2 p, vec2 a, vec2 b, float r) { vec2 pa = p - a, ba = b - a; float h = clamp(dot(pa, ba) / max(dot(ba, ba), 1e-5), 0.0, 1.0); return length(pa - ba * h) - r; }
float sdf(vec2 p) { return smin(sdSeg(p, uA - uSeg, uA + uSeg, uRA), length(p - uB) - uRB, uK); }
// soft capsule around a project (c = left x, centre y, right x, radius), fading out over 'feather'
float capMask(vec2 q, vec4 c, float feather) {
  if (c.w < 0.5) return 0.0;
  float mid = (c.x + c.z) * 0.5;
  float d = sdSeg(q, vec2(min(c.x + c.w, mid), c.y), vec2(max(c.z - c.w, mid), c.y), c.w);
  return 1.0 - smoothstep(-c.w * 0.55, feather, d);
}
vec3 sharp(vec2 p) {
  vec2 q = (p - uDRect.xy) / uDRect.zw;
  if (uDetailOn > 0.5 && q.x > 0.0 && q.x < 1.0 && q.y > 0.0 && q.y < 1.0) return texture2D(uDetail, vec2(q.x, 1.0 - q.y)).rgb;
  return texture2D(uSharp, toUV(p)).rgb;
}

vec3 blurAt(vec2 p) {
  vec2 uv = toUV(p);
  vec3 c = texture2D(uBlur, uv).rgb * 2.0;
  for (int i = 0; i < 8; i++) {
    float a = float(i) * 0.7853982 + 0.39;
    c += texture2D(uBlur, uv + vec2(cos(a), sin(a)) * uTexel * 1.8).rgb;
  }
  return c / 10.0;
}

void main() {
  vec2 p = vec2(gl_FragCoord.x, uView.y * uDpr - gl_FragCoord.y) / uDpr;
  float s = sdf(p);

  // the unfocused surface, with the drop's soft contact shadow
  vec3 col = blurAt(p) * uDim;
  float sh = 1.0 - smoothstep(-8.0, 30.0, sdf(p - vec2(0.0, 14.0)));
  col *= 1.0 - 0.45 * sh * step(0.0, s) * smoothstep(1.0, 24.0, uRA);
  col += (hash(floor(p * uDpr)) - 0.5) * 0.016;

  if (s < 1.5 && uRA > 0.5) {
    vec2 e = vec2(1.0, 0.0);
    vec2 g = vec2(sdf(p + e.xy) - sdf(p - e.xy), sdf(p + e.yx) - sdf(p - e.yx));
    vec2 n = g / max(length(g), 1e-4);                 // outward edge normal
    float d = max(-s, 0.0);                            // depth inside the drop (px)
    float t = clamp(d / uBevel, 0.0, 1.0);
    float h = sqrt(max(0.0, 1.0 - (1.0 - t) * (1.0 - t)));   // rounded bevel, flat top
    float bend = pow(1.0 - h, 1.35);

    // refraction: flat centre magnifies, the rim bends light in from outside
    vec2 base = uSrc + (p - uA) / uMag;
    vec2 off = n * uBevel * 1.05 * bend;
    vec3 inside;
    inside.r = sharp(base + off * 1.07).r;
    inside.g = sharp(base + off).g;
    inside.b = sharp(base + off * 0.93).b;

    // focus: only the project under the drop stays bright and crisp
    if (uHiAmt > 0.001) {
      vec2 q = base + off;
      float hi = max(capMask(q, uHi0, uFeather), capMask(q, uHi1, uFeather));

const drop = {

  bx: 0, by: 0, bvx: 0, bvy: 0,
  r: 150, rv: 0,
  tx: 0, ty: 0,

    drop.openMag = Math.max(1.2, Math.min(free.w * 0.78 / t.w, free.h * 0.62 / t.h, 6));
    if (glOK) {
      const m = drop.openMag, dpr = Math.min(devicePixelRatio || 1, 2);
      const x0 = drop.ox - ax / m, y0 = drop.oy - ay / m, w = W / m, h = H / m;
      const pad = 0.08, rx = x0 - w * pad, ry = y0 - h * pad, rw = w * (1 + 2 * pad), rh = h * (1 + 2 * pad);
      const maxTex = Math.min(gl.getParameter(gl.MAX_TEXTURE_SIZE), 4096);
      renderDetail(rx, ry, rw, rh, Math.min(dpr * m, maxTex / rw, maxTex / rh));
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
      gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, texDetail);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, detail);
      detailOn = 1;
    }
  }
  setTarget(ax, ay);
  $("#closeBtn").focus({ preventScroll: true });
}

function close() {
  if (!openRow) return;
  const r = openRow; openRow = null;
  sheet.hidden = true; sheet.innerHTML = ""; document.body.classList.remove("is-open");
  drop.tblend = 0;
  if (r.item !== ME) setTarget(r.fx, r.fy);
  lastInput = performance.now();
  if (returnFocus && returnFocus.focus) returnFocus.focus({ preventScroll: true });
}

const ABOUT = { item: ME };

function buildIndex() {
  const ol = $("#indexList");
  ol.innerHTML = WORK.map((w, i) => `<li><button data-i="${i}"><span class="it">${esc(w.title)}</span><span class="ik" style="--dot:${STATUS[w.status]}">${esc(w.kind.toLowerCase().includes(w.status.toLowerCase()) ? w.kind.replace(new RegExp("\\s*·\\s*" + w.status, "i"), "") : w.kind)}<i aria-hidden="true"></i>${esc(w.status)}</span></button></li>`).join("");
  ol.addEventListener("click", (e) => {
    const b = e.target.closest("button[data-i]"); if (!b) return;
    const item = WORK[+b.dataset.i];
    const br = b.getBoundingClientRect();
    toggleIndex(false, 60 + Math.min(br.width * 0.25, 300), br.top + br.height / 2, false);
    const r = rows.find(x => x.item === item);
    if (glOK) { drop.ax = drop.bx = r.fx; drop.ay = drop.by = r.fy; }
    open(r);
  });
}

// the index pours out of the Index button and drains back into whatever sends you home
let indexTimer = null;
function toggleIndex(show, ox, oy, toCanvas = true) {
  if (openRow) close();
  setSnap(null);
  clearTimeout(indexTimer);
  const btnBack = $("#btnBack");
  if (ox !== undefined) {
    // move the circle's centre while it still covers everything, so the shrink starts at once and ends in the button
    const cover = Math.max(Math.hypot(ox, oy), Math.hypot(W - ox, oy), Math.hypot(ox, H - oy), Math.hypot(W - ox, H - oy)) + 2;
    indexEl.style.transition = "none";
    indexEl.style.setProperty("--ox", ox + "px"); indexEl.style.setProperty("--oy", oy + "px");
    indexEl.style.setProperty("--rmax", cover + "px");
    indexEl.getBoundingClientRect();
    indexEl.style.transition = "";
  }
  document.body.classList.toggle("is-index", show);
  btnIndex.setAttribute("aria-pressed", String(show));
  if (show) {
    spawnHold = false;
    btnBack.classList.remove("sink");
    indexEl.hidden = false;
    indexEl.getBoundingClientRect();
    requestAnimationFrame(() => indexEl.classList.add("shown"));
    btnBack.hidden = false;
    const first = indexEl.querySelector("button"); first && first.focus({ preventScroll: true });
  } else {
    indexEl.classList.remove("shown");
    btnBack.classList.add("sink");
    if (toCanvas && glOK) {
      // park the drop, invisible, where the pointer is; it grows back once the index is gone
      const [px, py] = lastMouse || [ox ?? W / 2, oy ?? H / 2];
      drop.ax = drop.bx = drop.tx = px; drop.ay = drop.by = drop.ty = py;
      drop.avx = drop.avy = drop.bvx = drop.bvy = 0;
      drop.r = 0; drop.rv = 0; drop.seg = drop.segT = 0; drop.segV = 0;
      hi.amt = 0;
      spawnHold = true;
    }
    let done = false;
    const finish = () => {
      if (done) return; done = true;
      indexEl.removeEventListener("transitionend", onEnd);
      indexEl.hidden = true; btnBack.hidden = true; btnBack.classList.remove("sink");
      // wait one frame so the canvas is on screen before the drop starts to grow
      requestAnimationFrame(() => { spawnHold = false; lastInput = performance.now(); lastT = performance.now(); kick(); });
    };
    const onEnd = (e) => { if (e.target === indexEl && e.propertyName === "clip-path") finish(); };
    indexEl.addEventListener("transitionend", onEnd);
    indexTimer = setTimeout(finish, reduced ? 0 : 780);
    if (!openRow && !toCanvas) btnIndex.focus({ preventScroll: true });
  }
  kick();
}
function centre(el) { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; }
btnIndex.addEventListener("click", () => { if (glOK && indexEl.hidden) toggleIndex(true, ...centre(btnIndex)); });
$("#btnBack").addEventListener("click", () => toggleIndex(false, ...centre($("#btnBack"))));
btnAbout.addEventListener("click", () => { if (!indexEl.hidden) toggleIndex(false, undefined, undefined, false); if (openRow) close(); open(ABOUT); });

/* ============================== BOOT ============================== */
function resize() {
  W = innerWidth; H = innerHeight;
  const dpr = Math.min(devicePixelRatio || 1, 2);
  cvs.width = Math.round(W * dpr); cvs.height = Math.round(H * dpr);
  layout();
  if (glOK) { buildField(gl.getParameter(gl.MAX_TEXTURE_SIZE)); uploadTextures(); }
  if (openRow) { const r = openRow.item === ME ? ABOUT : rows.find(x => x.item === openRow.item); openRow = null; open(r); }
  kick();
}

async function boot() {
  buildIndex();
  const fonts = [`600 60px Geist`, `700 20px Geist`, `400 12px "Geist Mono"`];
  try { await Promise.race([Promise.all(fonts.map(f => document.fonts.load(f, "PRMřČé"))), new Promise(r => setTimeout(r, 2500))]); } catch (_) {}
  if (glOK) { try { initGL(); } catch (err) { console.error(err); glOK = false; } }
  if (!glOK) {
    $("#nogl").hidden = false; cvs.hidden = true; readout.hidden = true; hint.hidden = true;
    indexEl.hidden = false; indexEl.classList.add("shown"); btnIndex.hidden = true; layout(); return;
  }
  W = innerWidth; H = innerHeight; layout();
  const start = rows[0];
  drop.ax = drop.bx = drop.tx = start.fx; drop.ay = drop.by = drop.ty = start.fy;
  const ft = focusTargets(); drop.r = ft.r; drop.mag = ft.mag;
  resize();
  if (reduced) toggleIndex(true, W - 60, 40);
  let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(resize, 140); });
  if (document.fonts && document.fonts.addEventListener) document.fonts.addEventListener("loadingdone", () => { if (glOK) { layout(); buildField(gl.getParameter(gl.MAX_TEXTURE_SIZE)); uploadTextures(); kick(); } });
}
boot();
})();
</script>
