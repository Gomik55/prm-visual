<style>
  :root {
    color-scheme: dark;
    --ink: #0d0d0e;
    --paper: #f2f2ef;
    --dim: rgba(242, 242, 239, 0.6);
    --faint: rgba(242, 242, 239, 0.34);
    --line: rgba(242, 242, 239, 0.12);
    --glass: rgba(24, 24, 26, 0.56);
    --sans: "Geist", "Helvetica Neue", Arial, system-ui, sans-serif;
    --mono: var(--sans);   /* labels now use Geist too: one typeface across the site */
  }
  [hidden] { display: none !important; }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--ink);
    color: var(--paper);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: none; }
  #gl.touch, body.is-open #gl { cursor: default; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  :focus-visible { outline: 1.5px solid var(--paper); outline-offset: 3px; border-radius: 999px; }

  /* ---------- glass material (CSS approximation for UI chrome) ---------- */
  .glass {
    background: var(--glass);
    -webkit-backdrop-filter: blur(30px) saturate(1.7);
    backdrop-filter: blur(30px) saturate(1.7);
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.16),
      inset 0 -1px 0 rgba(255, 255, 255, 0.04),
      0 18px 50px rgba(0, 0, 0, 0.42);
  }

  /* ---------- HUD ---------- */
  .hud {
    position: fixed; left: 0; right: 0; z-index: 7;
    display: flex; justify-content: space-between; align-items: center; gap: 16px;
    padding-inline: max(16px, 3vw);
    pointer-events: none;
  }
  .hud > * { pointer-events: auto; }
  @media (pointer: fine) {
    /* on the canvas the drop is the cursor, including over the header and the nav */
    .hud, .hud * { cursor: none; }
    .hud { user-select: none; -webkit-user-select: none; }
  }
  .mark, .hud-bottom { transition: opacity .3s; }
  body.is-open .mark, body.is-open .hud-bottom, body.is-index .hud-bottom { opacity: 0; pointer-events: none; }
  .hud-top { top: 0; padding-top: calc(env(safe-area-inset-top, 0px) + 20px); }
  .hud-bottom { bottom: 0; align-items: flex-end; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); }
  .hud-top { transition: opacity .3s; }
  body.is-index .hud-top, body.is-index .hud-bottom { opacity: 0; pointer-events: none; }

  .mark { font-weight: 600; font-size: 18px; letter-spacing: -0.03em; }

  /* nav: plain words; the drop itself becomes their highlight */
  .nav { display: flex; gap: 4px; }
  .nav button {
    padding: 8px 16px; border-radius: 999px;
    font-size: 14px; font-weight: 500; letter-spacing: -0.01em;
    color: rgba(242, 242, 239, 0.72);
    transition: color .25s;
  }
  .nav button:hover, .nav button.lit { color: var(--paper); }
  @media (pointer: coarse) {
    .nav {
      padding: 4px; border-radius: 999px;
      background: var(--glass);
      -webkit-backdrop-filter: blur(30px) saturate(1.7); backdrop-filter: blur(30px) saturate(1.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16), 0 12px 30px rgba(0, 0, 0, 0.4);
    }
    .nav button { color: var(--paper); }
  }
  .hint { font-size: 13px; color: var(--dim); max-width: 36ch; margin: 0; letter-spacing: -0.005em; }
  .hint { transition: opacity .8s ease; }
  .hint.gone { opacity: 0; }


  /* ---------- case study sheet ---------- */
  #sheet {
    position: fixed; z-index: 8;
    top: calc(env(safe-area-inset-top, 0px) + 16px);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
    right: 16px;
    width: min(460px, calc(100% - 32px));
    overflow: hidden;
    border-radius: 30px;
    display: flex; flex-direction: column;
    animation: rise .5s cubic-bezier(.2, .9, .25, 1);
  }
  .sheet-scroll {
    flex: 1 1 auto; min-height: 0; overflow-y: auto;
    padding: 28px 30px 32px;
    display: flex; flex-direction: column; gap: 22px;
  }
  @keyframes rise { from { transform: translateY(18px) scale(.98); opacity: 0; } }
  .sheet-head { display: flex; align-items: center; min-height: 34px; padding-right: 48px; }
  .kind, .facts dt, #index .ik, .motto { font-weight: 500; font-variant-numeric: tabular-nums; }
  .kind { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); }
  .close {
    position: absolute; z-index: 2; top: 24px; right: 26px;
    width: 34px; height: 34px; border-radius: 50%;
    display: grid; place-items: center;
    background: rgba(48, 48, 52, 0.72);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14), 0 4px 14px rgba(0, 0, 0, 0.35);
    font-size: 18px; line-height: 1;
    transition: background-color .2s;
  }
  .close:hover { background: rgba(70, 70, 76, 0.8); }
  #sheet h2 {
    font-weight: 600; font-size: clamp(46px, 6vw, 68px);
    line-height: 0.92; letter-spacing: -0.05em;
    margin: 0; text-wrap: balance;
  }
  .lede { font-size: 20px; font-weight: 500; line-height: 1.3; letter-spacing: -0.02em; margin: 0; text-wrap: pretty; }
  .body { font-size: 15px; color: var(--dim); margin: 0; text-wrap: pretty; }
  .facts { display: grid; gap: 0; margin: 0; }
  .facts > div { display: grid; grid-template-columns: 96px 1fr; gap: 14px; padding-block: 13px; border-top: 1px solid var(--line); }
  .facts dt { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); padding-top: 3px; }
  .facts dd { margin: 0; font-size: 14.5px; }
  .facts ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips span { font-family: var(--mono); font-size: 11.5px; padding: 4px 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.07); }
  .status { display: inline-flex; align-items: center; gap: 8px; }
  .status i { width: 9px; height: 9px; border-radius: 50%; background: var(--dot, var(--paper)); }
  .visit {
    align-self: flex-start; text-decoration: none; color: var(--ink); background: var(--paper);
    font-size: 14px; font-weight: 600; letter-spacing: -0.01em;
    padding: 10px 18px; border-radius: 999px;
    transition: transform .2s;
  }
  .visit:hover { transform: translateY(-1px); }
  .links { display: flex; flex-wrap: wrap; gap: 8px; }
  .links:empty { display: none; }
  .visit.ghost { background: rgba(255, 255, 255, 0.1); color: var(--paper); }
  .copyrow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .copyrow code { font-family: var(--mono); font-size: 13.5px; user-select: all; }
  .copyrow button { font-size: 12.5px; font-weight: 500; padding: 4px 11px; border-radius: 999px; background: rgba(255, 255, 255, 0.1); }
  .motto { font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.1em; color: var(--faint); margin: 0; }

  /* ---------- index ---------- */
  #index {
    position: fixed; inset: 0; z-index: 6;
    background: var(--ink);
    overflow-y: auto;
    will-change: clip-path;
    contain: paint;
    padding-inline: max(16px, 3vw);
    padding-block: calc(env(safe-area-inset-top, 0px) + 40px) 150px;
    clip-path: circle(0px at var(--ox, 90%) var(--oy, 4%));
    transition: clip-path .66s cubic-bezier(.55, 0, .25, 1);
  }
  #index.shown { clip-path: circle(var(--rmax, 200vmax) at var(--ox, 90%) var(--oy, 4%)); }
  #index .ik { display: inline-flex; align-items: center; gap: 10px; }
  #index .ik i { width: 9px; height: 9px; border-radius: 50%; background: var(--dot); }

  #btnBack {
    position: fixed; z-index: 9; left: 50%;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
    display: flex; align-items: center; gap: 10px;
    padding: 12px 26px; border-radius: 999px;
    font-size: 14px; font-weight: 500; letter-spacing: -0.01em;
    transform: translateX(-50%);
    transition: transform .45s cubic-bezier(.3, 1.6, .45, 1), opacity .25s ease .5s;
    animation: pop .6s cubic-bezier(.3, 1.6, .45, 1) .25s both;
  }
  #btnBack:hover { transform: translateX(-50%) scale(1.07); }
  #btnBack.sink { transform: translateX(-50%) scale(.82); opacity: 0; pointer-events: none; }
  @keyframes pop { from { transform: translateX(-50%) scale(.4); opacity: 0; } }
  #index ol { list-style: none; margin: 0; padding: 0; }
  #index li { border-top: 1px solid var(--line); }
  #index button {
    width: 100%; text-align: left;
    display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 24px;
    padding-block: 14px 16px;
  }
  #index .it { font-weight: 600; font-size: clamp(34px, 6.4vw, 72px); line-height: 1; letter-spacing: -0.05em; transition: transform .35s cubic-bezier(.2, .9, .25, 1); }
  #index button:hover .it, #index button:focus-visible .it { transform: translateX(12px); }
  #index .ik { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); }

  #nogl { position: fixed; inset: 0; display: grid; place-items: center; padding-inline: 16px; text-align: center; color: var(--dim); }

  @media (max-width: 700px) {
    #index button { flex-direction: column; align-items: flex-start; justify-content: flex-start; gap: 8px; padding-block: 14px 16px; }
    #index .it { font-size: clamp(34px, 10.5vw, 48px); }
    #sheet {
      top: auto; left: 10px; right: 10px; bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
      width: auto; max-height: 64%;
      border-radius: 28px;
    }
    .sheet-scroll { padding: 22px 22px 26px; gap: 18px; }
    .close { top: 18px; right: 18px; }
    .facts > div { grid-template-columns: 1fr; gap: 6px; }
    .hint { max-width: 24ch; }
    .mark { font-size: 17px; }
  }
  @media (max-width: 700px), (pointer: coarse) {
    .hud-bottom { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    #sheet { animation: none; }
    #index .it { transition: none; }
    #index { transition: none; }
    #btnBack { animation: none; }
  }
</style>
</head>

let W = innerWidth, H = innerHeight, rows = [];

function rng(seedStr) {
  let h = 1779033703 ^ seedStr.length;
  for (let i = 0; i < seedStr.length; i++) { h = Math.imul(h ^ seedStr.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
  let a = h >>> 0;
  return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function rr(c, x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
function spacing(c, v) { if ("letterSpacing" in c) c.letterSpacing = v; }

/* ---------- small procedural visuals, one per project ---------- */
const G = {
  // ROOST — forest green above, soil and roots below; the wordmark's OO are eyes with a sprout between them
  roost(c, x, y, w, h) {
    const ground = y + h * 0.7;
    let g = c.createLinearGradient(x, y, x, ground);
    g.addColorStop(0, "#2E6446"); g.addColorStop(1, "#1E442B");
    c.fillStyle = g; c.fillRect(x, y, w, ground - y);
    g = c.createLinearGradient(x, ground, x, y + h);
    g.addColorStop(0, "#2a2317"); g.addColorStop(1, "#15110b");
    c.fillStyle = g; c.fillRect(x, ground, w, y + h - ground);
    const glow = c.createRadialGradient(x + w / 2, y + h * 0.45, 0, x + w / 2, y + h * 0.45, w * 0.45);
    glow.addColorStop(0, "rgba(144,184,54,.30)"); glow.addColorStop(1, "rgba(144,184,54,0)");
    c.fillStyle = glow; c.fillRect(x, y, w, h);
    c.fillStyle = "rgba(183,224,74,.35)"; c.fillRect(x, ground, w, Math.max(0.6, h * 0.008));
    // roots
    c.strokeStyle = "rgba(176,138,88,.55)"; c.lineCap = "round";
    [[0.12, 0.98, -0.04], [0.22, 0.86, 0.04], [0.8, 0.9, -0.05], [0.9, 1.0, 0.04]].forEach(([fx, fy, bend], i) => {
      c.lineWidth = Math.max(0.5, h * (i % 2 ? 0.007 : 0.01));
      c.beginPath(); c.moveTo(x + w * fx, ground);
      c.bezierCurveTo(x + w * (fx + bend), ground + h * 0.08, x + w * (fx - bend), ground + h * 0.16, x + w * (fx + bend * 1.5), y + h * fy);
      c.stroke();
    });
    // wordmark: R ◉◉ ST
    const fs = h * 0.34, base = y + h * 0.6;
    c.font = `700 ${fs}px ${FONT}`; spacing(c, "-0.03em");
    const wR = c.measureText("R").width, wST = c.measureText("ST").width;
    const eye = fs * 0.74, gap = fs * 0.05;
    const total = wR + gap + eye * 2 + gap * 0.6 + gap + wST;
    let cx = x + (w - total) / 2;
    c.fillStyle = "#F5EFE6"; c.fillText("R", cx, base); cx += wR + gap;
    const ey = base - fs * 0.355, er = eye / 2;
    const eyeAt = (ex) => {
      c.fillStyle = "#90B836"; c.beginPath(); c.arc(ex, ey, er, 0, 7); c.fill();
      c.fillStyle = "#16281B"; c.beginPath(); c.arc(ex + er * 0.12, ey + er * 0.1, er * 0.56, 0, 7); c.fill();
      c.fillStyle = "#FBF8F0"; c.beginPath(); c.arc(ex - er * 0.1, ey - er * 0.14, er * 0.17, 0, 7); c.fill();
    };
    const e1 = cx + er, e2 = cx + eye + gap * 0.6 + er;
    eyeAt(e1); eyeAt(e2); cx += eye * 2 + gap * 0.6 + gap;
    c.fillStyle = "#F5EFE6"; c.fillText("ST", cx, base); spacing(c, "0px");
    // sprout between the eyes (the logo's own path, scaled)
    const sw = eye * 1.25, sh = sw * 0.7, sx = (e1 + e2) / 2 - sw / 2, sy = ey - er - sh * 0.92;
    c.save(); c.translate(sx, sy); c.scale(sw / 100, sh / 70);
    c.strokeStyle = "#B7E04A"; c.lineWidth = 7; c.lineCap = "round";
    c.beginPath(); c.moveTo(50, 70); c.bezierCurveTo(50, 56, 48, 44, 50, 32); c.stroke();
    c.fillStyle = "#B7E04A";
    c.beginPath(); c.moveTo(48, 34); c.bezierCurveTo(42, 20, 28, 10, 15, 15); c.bezierCurveTo(13, 28, 26, 38, 48, 34); c.fill();
    c.beginPath(); c.moveTo(52, 33); c.bezierCurveTo(58, 14, 74, 4, 89, 8); c.bezierCurveTo(91, 24, 76, 36, 52, 33); c.fill();
    c.restore();
    // quiet tagline in the soil, only readable up close
    c.fillStyle = "rgba(245,239,230,.45)"; c.font = `500 ${h * 0.055}px ${FONT}`; spacing(c, "0.18em"); c.textAlign = "center";
    c.fillText("POMÁHÁME PODNIKŮM RŮST", x + w / 2, y + h * 0.87); c.textAlign = "left"; spacing(c, "0px");
  },

  // Jiří Čeněk — near-black, periwinkle accent, "JČ." mark, the headline number, and vertical reels
  cenek(c, x, y, w, h, R) {
    c.fillStyle = "#08090C"; c.fillRect(x, y, w, h);
    let g = c.createRadialGradient(x + w * 0.78, y + h * 0.2, 0, x + w * 0.78, y + h * 0.2, w * 0.55);
    g.addColorStop(0, "rgba(124,155,255,.22)"); g.addColorStop(1, "rgba(124,155,255,0)");
    c.fillStyle = g; c.fillRect(x, y, w, h);
    // left: mark + stat
    const lx = x + w * 0.07;
    c.font = `700 ${h * 0.3}px ${FONT}`; spacing(c, "-0.04em");
    c.fillStyle = "#F4F5F9"; c.fillText("JČ", lx, y + h * 0.42);
    const jw = c.measureText("JČ").width;
    c.fillStyle = "#7C9BFF"; c.beginPath(); c.arc(lx + jw + h * 0.035, y + h * 0.42 - h * 0.025, h * 0.028, 0, 7); c.fill();
    c.font = `700 ${h * 0.15}px ${FONT}`; spacing(c, "-0.03em");
    c.fillStyle = "#F4F5F9"; c.fillText("1,9 M+", lx, y + h * 0.7);
    c.fillStyle = "#7C9BFF"; rr(c, lx, y + h * 0.76, w * 0.13, h * 0.022, h * 0.011); c.fill();
    c.font = `600 ${h * 0.05}px ${FONT}`; spacing(c, "0.14em");
    c.fillStyle = "#9498A5"; c.fillText("ZHLÉDNUTÍ", lx, y + h * 0.88); spacing(c, "0px");
    // right: three 9:16 reels, staggered like his gallery
    const fh = h * 0.72, fw = fh * 9 / 16, ccx = x + w * 0.72, ccy = y + h * 0.5;
    const scenes = ["pitch", "sport", "estate"];
    const fan = [{ i: 0, dx: -0.64, rot: -0.16, s: 0.88 }, { i: 2, dx: 0.64, rot: 0.16, s: 0.88 }, { i: 1, dx: 0, rot: 0, s: 1 }];
    fan.forEach(({ i, dx, rot, s: sc }) => {
      const k = scenes[i];
      c.save(); c.translate(ccx + fw * dx, ccy + (sc < 1 ? h * 0.04 : 0)); c.rotate(rot); c.scale(sc, sc);
      const fx = -fw / 2, fy = -fh / 2;
      c.save();
      c.shadowColor = "rgba(0,0,0,.6)"; c.shadowBlur = h * 0.08; c.shadowOffsetY = h * 0.03;
      rr(c, fx, fy, fw, fh, fw * 0.14); c.fillStyle = "#111"; c.fill();
      c.restore();
      c.save(); rr(c, fx, fy, fw, fh, fw * 0.14); c.clip();
      if (k === "pitch") {                       // drone over a pitch
        let gg = c.createLinearGradient(fx, fy, fx + fw, fy + fh); gg.addColorStop(0, "#3f7a4f"); gg.addColorStop(1, "#1f4a2d");
        c.fillStyle = gg; c.fillRect(fx, fy, fw, fh);
        c.fillStyle = "rgba(255,255,255,.06)"; for (let s = 0; s < 6; s++) if (s % 2) c.fillRect(fx, fy + s * fh / 6, fw, fh / 6);
        c.strokeStyle = "rgba(255,255,255,.8)"; c.lineWidth = Math.max(0.5, fw * 0.025);
        c.strokeRect(fx + fw * 0.12, fy + fh * 0.12, fw * 0.76, fh * 0.76);
        c.beginPath(); c.moveTo(fx + fw * 0.12, fy + fh / 2); c.lineTo(fx + fw * 0.88, fy + fh / 2); c.stroke();
        c.beginPath(); c.arc(fx + fw / 2, fy + fh / 2, fw * 0.16, 0, 7); c.stroke();
      } else if (k === "sport") {                // under the lights
        let gg = c.createLinearGradient(fx, fy, fx, fy + fh); gg.addColorStop(0, "#2a3f8f"); gg.addColorStop(1, "#0c1433");
        c.fillStyle = gg; c.fillRect(fx, fy, fw, fh);
        for (let b = 0; b < 5; b++) { const bx = fx + fw * (0.15 + b * 0.18), by = fy + fh * 0.16; const bg = c.createRadialGradient(bx, by, 0, bx, by, fw * 0.16); bg.addColorStop(0, "rgba(220,230,255,.55)"); bg.addColorStop(1, "rgba(220,230,255,0)"); c.fillStyle = bg; c.fillRect(bx - fw * 0.2, by - fw * 0.2, fw * 0.4, fw * 0.4); }
        c.fillStyle = "#070a18";                  // player silhouette
        c.beginPath(); c.arc(fx + fw * 0.52, fy + fh * 0.5, fw * 0.1, 0, 7); c.fill();
        c.beginPath(); c.moveTo(fx + fw * 0.3, fy + fh); c.quadraticCurveTo(fx + fw * 0.32, fy + fh * 0.6, fx + fw * 0.52, fy + fh * 0.6); c.quadraticCurveTo(fx + fw * 0.72, fy + fh * 0.6, fx + fw * 0.74, fy + fh); c.fill();
      } else {                                   // real estate at dusk
        let gg = c.createLinearGradient(fx, fy, fx, fy + fh); gg.addColorStop(0, "#7C9BFF"); gg.addColorStop(0.55, "#3a3f6a"); gg.addColorStop(1, "#15161f");
        c.fillStyle = gg; c.fillRect(fx, fy, fw, fh);
        c.fillStyle = "#0b0c12";
        c.beginPath(); c.moveTo(fx + fw * 0.1, fy + fh * 0.72); c.lineTo(fx + fw * 0.1, fy + fh * 0.55); c.lineTo(fx + fw * 0.45, fy + fh * 0.4); c.lineTo(fx + fw * 0.8, fy + fh * 0.55); c.lineTo(fx + fw * 0.8, fy + fh * 0.72); c.closePath(); c.fill();
        c.fillRect(fx, fy + fh * 0.72, fw, fh * 0.28);
        c.fillStyle = "rgba(255,214,140,.85)"; c.fillRect(fx + fw * 0.3, fy + fh * 0.58, fw * 0.1, fh * 0.06); c.fillRect(fx + fw * 0.52, fy + fh * 0.58, fw * 0.1, fh * 0.06);
      }
      // story progress bar
      for (let s = 0; s < 3; s++) { c.fillStyle = s <= i ? "rgba(255,255,255,.85)" : "rgba(255,255,255,.3)"; rr(c, fx + fw * (0.08 + s * 0.29), fy + fh * 0.04, fw * 0.26, Math.max(0.6, fh * 0.012), fh * 0.006); c.fill(); }
      c.restore();
      rr(c, fx + 0.5, fy + 0.5, fw - 1, fh - 1, fw * 0.14); c.strokeStyle = "rgba(255,255,255,.14)"; c.lineWidth = 1; c.stroke();
      c.restore();
    });
  },

  // claude — pure black, a peak breaking through the clouds, the stretched C floating above it: "Made to float"
  claude(c, x, y, w, h) {
    let g = c.createLinearGradient(x, y, x, y + h); g.addColorStop(0, "#0d0d0f"); g.addColorStop(1, "#000");
    c.fillStyle = g; c.fillRect(x, y, w, h);
    const px = x + w * 0.5, top = y + h * 0.36, base = y + h * 0.86;
    // mountain: dark rock, one lit face
    g = c.createLinearGradient(px, top, px, base); g.addColorStop(0, "#2b2b2f"); g.addColorStop(1, "#0b0b0c");
    c.fillStyle = g;
    const ridge = [[-0.3, 1], [-0.2, 0.62], [-0.15, 0.66], [-0.08, 0.4], [-0.04, 0.44], [0, 0], [0.05, 0.3], [0.09, 0.26], [0.16, 0.56], [0.21, 0.52], [0.31, 1]];
    c.beginPath(); ridge.forEach(([dx, dy], i) => { const X = px + w * dx, Y = top + (base - top) * dy; i ? c.lineTo(X, Y) : c.moveTo(X, Y); }); c.closePath(); c.fill();
    c.fillStyle = "rgba(225,225,232,.62)";
    c.beginPath(); c.moveTo(px, top); c.lineTo(px - w * 0.04, top + (base - top) * 0.44); c.lineTo(px - w * 0.015, top + (base - top) * 0.36); c.lineTo(px + w * 0.012, top + (base - top) * 0.2); c.closePath(); c.fill();
    c.fillStyle = "rgba(225,225,232,.28)";
    c.beginPath(); c.moveTo(px - w * 0.08, top + (base - top) * 0.4); c.lineTo(px - w * 0.13, top + (base - top) * 0.62); c.lineTo(px - w * 0.1, top + (base - top) * 0.58); c.closePath(); c.fill();
    // cloud bank swallowing the base
    const puff = (cx, cy, r, a) => {
      c.save(); c.translate(cx, cy); c.scale(2.1, 1);
      const pg = c.createRadialGradient(0, -r * 0.2, 0, 0, 0, r);
      pg.addColorStop(0, `rgba(236,236,240,${a})`); pg.addColorStop(0.5, `rgba(214,214,220,${a * 0.55})`); pg.addColorStop(1, "rgba(200,200,206,0)");
      c.fillStyle = pg; c.beginPath(); c.arc(0, 0, r, 0, 7); c.fill(); c.restore();
    };
    const R2 = rng("claude-clouds");
    for (let i = 0; i < 18; i++) {
      const fx = 0.02 + R2() * 0.96, fy = 0.74 + R2() * 0.14, fr = 0.07 + R2() * 0.07;
      puff(x + w * fx, y + h * fy, h * fr, 0.14 + R2() * 0.14);
    }
    const haze = c.createLinearGradient(x, y + h * 0.9, x, y + h); haze.addColorStop(0, "rgba(0,0,0,0)"); haze.addColorStop(1, "rgba(0,0,0,.7)");
    c.fillStyle = haze; c.fillRect(x, y + h * 0.9, w, h * 0.1);
    // the stretched C as a halo
    const hx = px, hy = y + h * 0.2, rx = w * 0.13, ry = h * 0.055;
    c.save(); c.translate(hx, hy); c.scale(1, ry / rx);
    c.strokeStyle = "#F2F2EF"; c.lineWidth = rx * 0.34; c.lineCap = "butt";
    c.beginPath(); c.arc(0, 0, rx, 0.42, Math.PI * 2 - 0.42); c.stroke();
    c.restore();
    c.fillStyle = "rgba(242,242,239,.5)"; c.font = `600 ${h * 0.05}px ${FONT}`; spacing(c, "0.32em"); c.textAlign = "center";
    c.fillText("MADE TO FLOAT", px, y + h * 0.965); c.textAlign = "left"; spacing(c, "0px");
  },
  // PRM Games — three little screens side by side: cells, a snake, a block board
  games(c, x, y, w, h, R) {
    c.fillStyle = "#0b100d"; c.fillRect(x, y, w, h);
    const glow = c.createRadialGradient(x + w / 2, y + h * 0.55, 0, x + w / 2, y + h * 0.55, w * 0.6);
    glow.addColorStop(0, "rgba(127,199,150,.16)"); glow.addColorStop(1, "rgba(127,199,150,0)");
    c.fillStyle = glow; c.fillRect(x, y, w, h);
    const pad = w * 0.045, gap = w * 0.03, sw = (w - pad * 2 - gap * 2) / 3, sh = h * 0.7, sy = y + h * 0.1;
    const names = ["KOGAR.IO", "KOTHER.IO", "PRMBLOCKS"];
    for (let i = 0; i < 3; i++) {
      const sx = x + pad + i * (sw + gap);
      c.save(); rr(c, sx, sy, sw, sh, sw * 0.12); c.fillStyle = "#101713"; c.fill(); c.clip();
      // grid
      c.strokeStyle = "rgba(255,255,255,.05)"; c.lineWidth = 1;
      for (let gx = sx; gx < sx + sw; gx += sw / 7) { c.beginPath(); c.moveTo(gx, sy); c.lineTo(gx, sy + sh); c.stroke(); }
      for (let gy = sy; gy < sy + sh; gy += sw / 7) { c.beginPath(); c.moveTo(sx, gy); c.lineTo(sx + sw, gy); c.stroke(); }
      if (i === 0) {
        const cols = ["#7fc796", "#e08aab", "#8aa8e0", "#e0c98a"];
        [[0.45, 0.5, 0.26], [0.18, 0.2, 0.07], [0.82, 0.28, 0.09], [0.22, 0.82, 0.08], [0.8, 0.78, 0.06], [0.6, 0.14, 0.04], [0.12, 0.55, 0.04]].forEach(([fx, fy, fr], k) => {
          c.fillStyle = cols[k % 4]; c.beginPath(); c.arc(sx + sw * fx, sy + sh * fy, sw * fr, 0, 7); c.fill();
          c.strokeStyle = "rgba(0,0,0,.25)"; c.lineWidth = sw * 0.02; c.stroke();
        });
      } else if (i === 1) {
        for (let k = 22; k >= 0; k--) {
          const t = k / 22, px = sx + sw * (0.5 + Math.sin(t * 5.2 + 0.6) * 0.3), py = sy + sh * (0.14 + 0.72 * t);
          c.fillStyle = k === 0 ? "#f3b7cb" : (k % 2 ? "#e08aab" : "#c97796");
          c.beginPath(); c.arc(px, py, sw * (0.085 - t * 0.04), 0, 7); c.fill();
          if (k === 0) { c.fillStyle = "#101713"; c.beginPath(); c.arc(px - sw * 0.03, py + sw * 0.02, sw * 0.015, 0, 7); c.arc(px + sw * 0.03, py + sw * 0.02, sw * 0.015, 0, 7); c.fill(); }
        }
        c.fillStyle = "#e0c98a"; [[0.8, 0.2], [0.25, 0.85], [0.7, 0.9]].forEach(([fx, fy]) => { c.beginPath(); c.arc(sx + sw * fx, sy + sh * fy, sw * 0.03, 0, 7); c.fill(); });
      } else {
        const n = 5, cell = (sw * 0.8) / n, ox = sx + sw * 0.1, oy = sy + (sh - cell * n) / 2;
        const cols = ["#ec8a68", "#6fb8ab", "#dcb45c", "#a99ade"];
        for (let a = 0; a < n; a++) for (let b = 0; b < n; b++) {
          rr(c, ox + a * cell + 1, oy + b * cell + 1, cell - 2, cell - 2, cell * 0.2);
          c.fillStyle = R() < 0.5 ? cols[Math.floor(R() * 4)] : "rgba(255,255,255,.06)"; c.fill();
        }
      }
      c.restore();
      rr(c, sx + 0.5, sy + 0.5, sw - 1, sh - 1, sw * 0.12); c.strokeStyle = "rgba(255,255,255,.12)"; c.lineWidth = 1; c.stroke();
      c.fillStyle = "rgba(242,242,239,.55)"; c.font = `600 ${h * 0.055}px ${FONT}`; spacing(c, "0.16em"); c.textAlign = "center";
      c.fillText(names[i], sx + sw / 2, y + h * 0.92); c.textAlign = "left"; spacing(c, "0px");
    }
  },

  // Photo & Video — a camera viewfinder: focus brackets, REC, exposure readout
  photo(c, x, y, w, h) {
    let g = c.createLinearGradient(x, y, x, y + h);
    g.addColorStop(0, "#2b2f36"); g.addColorStop(0.55, "#16181c"); g.addColorStop(1, "#0b0b0d");
    c.fillStyle = g; c.fillRect(x, y, w, h);
    // soft bokeh of a scene out of focus
    [[0.2, 0.3, 0.14, "255,214,160"], [0.72, 0.24, 0.1, "190,210,255"], [0.55, 0.62, 0.18, "255,236,210"], [0.86, 0.66, 0.12, "255,200,150"], [0.34, 0.74, 0.1, "210,225,255"]]
      .forEach(([fx, fy, fr, col]) => { const b = c.createRadialGradient(x + w * fx, y + h * fy, 0, x + w * fx, y + h * fy, h * fr * 1.6); b.addColorStop(0, `rgba(${col},.32)`); b.addColorStop(1, `rgba(${col},0)`); c.fillStyle = b; c.fillRect(x, y, w, h); });
    // horizon silhouette
    c.fillStyle = "#08090a"; c.beginPath(); c.moveTo(x, y + h * 0.8);
    for (let k = 0; k <= 10; k++) c.lineTo(x + w * k / 10, y + h * (0.74 + ((k * 37) % 7) / 60)); c.lineTo(x + w, y + h); c.lineTo(x, y + h); c.fill();
    // frame guides
    const m = h * 0.1, L = h * 0.12;
    c.strokeStyle = "rgba(255,255,255,.85)"; c.lineWidth = Math.max(0.7, h * 0.012);
    [[x + m, y + m, 1, 1], [x + w - m, y + m, -1, 1], [x + m, y + h - m, 1, -1], [x + w - m, y + h - m, -1, -1]].forEach(([px, py, dx, dy]) => { c.beginPath(); c.moveTo(px, py + dy * L); c.lineTo(px, py); c.lineTo(px + dx * L, py); c.stroke(); });
    // focus square
    const fs = h * 0.2; c.strokeStyle = "rgba(255,255,255,.9)"; c.lineWidth = Math.max(0.6, h * 0.008);
    c.strokeRect(x + w / 2 - fs / 2, y + h / 2 - fs / 2, fs, fs);
    // REC + readout
    const ts = h * 0.065;
    c.fillStyle = "#ff453a"; c.beginPath(); c.arc(x + m + ts * 0.4, y + m + L + ts * 0.9, ts * 0.32, 0, 7); c.fill();
    c.font = `600 ${ts}px ${FONT}`; spacing(c, "0.1em"); c.fillStyle = "rgba(255,255,255,.9)";
    c.fillText("REC", x + m + ts * 1.0, y + m + L + ts * 1.25);
    c.textAlign = "right"; c.fillText("00:17:04", x + w - m, y + m + L + ts * 1.25);
    c.textAlign = "center"; c.fillStyle = "rgba(255,255,255,.7)";
    c.fillText("ISO 400   f/1.8   1/200", x + w / 2, y + h - m - ts * 0.3);
    c.textAlign = "left"; spacing(c, "0px");
  },

  once(c, x, y, w, h, R) {
    c.fillStyle = "#10121b"; c.fillRect(x, y, w, h);
    const inks = ["#8c9ee8", "#f2f2ef", "#ec8a68", "#b7c0ee", "#7fc796"];
    c.lineCap = "round"; c.lineJoin = "round";
    for (let i = 0; i < 18; i++) {
      c.strokeStyle = hexA(inks[i % inks.length], 0.6 + R() * 0.4);
      c.lineWidth = Math.max(0.6, h * (0.012 + R() * 0.02));
      let px = x + R() * w, py = y + R() * h;
      c.beginPath(); c.moveTo(px, py);
      for (let j = 0; j < 3; j++) {
        const dx = (R() - 0.3) * w * 0.25, dy = (R() - 0.5) * h * 0.4;
        c.bezierCurveTo(px + dx * 0.3, py - h * 0.15 * R(), px + dx * 0.7, py + dy + h * 0.12 * R(), px + dx, py + dy * 0.4);
        px += dx; py += dy * 0.4;
      }
      c.stroke();
    }
  },
  // Walldecor — a gallery wall mid-hang: some prints up, the rest still pencilled in
  walldecor(c, x, y, w, h) {
    const g = c.createLinearGradient(x, y, x, y + h); g.addColorStop(0, "#d8ccb9"); g.addColorStop(1, "#c4b59e");
    c.fillStyle = g; c.fillRect(x, y, w, h);
    c.fillStyle = "rgba(0,0,0,.05)"; c.fillRect(x, y + h * 0.88, w, h * 0.12);         // skirting
    const L = [[0.08, 0.14, 0.22, 0.56, 1], [0.34, 0.1, 0.18, 0.3, 1], [0.34, 0.46, 0.18, 0.28, 0], [0.56, 0.18, 0.26, 0.5, 1], [0.86, 0.14, 0.1, 0.24, 0], [0.86, 0.44, 0.1, 0.24, 0]];
    const arts = [["#d98f63", "#7e3f2c"], ["#9fb8c4", "#344552"], null, ["#86a88f", "#233b2c"], null, null];
    L.forEach(([fx, fy, fw, fh, done], i) => {
      const X = x + fx * w, Y = y + fy * h, FW = fw * w, FH = fh * h;
      if (done) {
        c.save(); c.shadowColor = "rgba(60,40,20,.28)"; c.shadowBlur = h * 0.05; c.shadowOffsetY = h * 0.025;
        c.fillStyle = "#1c1814"; c.fillRect(X, Y, FW, FH); c.restore();
        const b = Math.max(1, h * 0.012), m = Math.min(FW, FH) * 0.12;
        c.fillStyle = "#faf6ee"; c.fillRect(X + b, Y + b, FW - b * 2, FH - b * 2);
        const ag = c.createLinearGradient(X, Y, X + FW * 0.4, Y + FH); ag.addColorStop(0, arts[i][0]); ag.addColorStop(1, arts[i][1]);
        c.fillStyle = ag; c.fillRect(X + b + m, Y + b + m, FW - 2 * (b + m), FH - 2 * (b + m));
        if (i === 0) { c.fillStyle = "rgba(255,238,215,.85)"; c.beginPath(); c.arc(X + FW / 2, Y + FH * 0.42, FW * 0.13, 0, 7); c.fill(); }
      } else {                                   // pencilled outline, still to be hung
        c.save(); c.setLineDash([h * 0.03, h * 0.022]); c.strokeStyle = "rgba(90,70,50,.45)"; c.lineWidth = Math.max(0.6, h * 0.008);
        c.strokeRect(X, Y, FW, FH); c.restore();
        c.strokeStyle = "rgba(90,70,50,.3)"; c.lineWidth = Math.max(0.5, h * 0.005);
        c.beginPath(); c.moveTo(X + FW / 2 - h * 0.02, Y - h * 0.04); c.lineTo(X + FW / 2 + h * 0.02, Y - h * 0.04); c.stroke();
      }
    });
    c.fillStyle = "rgba(90,70,50,.55)"; c.font = `600 ${h * 0.05}px ${FONT}`; spacing(c, "0.16em");
    c.fillText("IN PROGRESS", x + w * 0.08, y + h * 0.83); spacing(c, "0px");
  }
};

/* ---------- layout: the work flows as one block of big type, like a sentence ---------- */
function nameWidth(c, text, f) { c.font = `600 ${f}px ${FONT}`; spacing(c, "-0.05em"); const w = c.measureText(text).width; spacing(c, "0px"); return w; }
function supWidth(c, text, ms) { c.font = `500 ${ms}px ${MONO}`; spacing(c, "0.08em"); const w = c.measureText(text).width; spacing(c, "0px"); return w; }

// greedy line breaking; a name and its preview stay together unless the screen is too narrow
function flow(f, availW, split) {
  const c = fctx; c.setTransform(1, 0, 0, 1, 0, 0);
  const gap = f * 0.3, glue = f * 0.16;
  const ms = Math.max(9, Math.min(13, f * 0.1));
  const lines = [[]]; let x = 0, widest = 0;
  const push = (kind, u, w) => { lines[lines.length - 1].push({ kind, u, x, w }); x += w; };
  const newLine = () => { lines.push([]); x = 0; };
  WORK.forEach(item => {
    const nameW = nameWidth(c, item.title, f);
    const th = f * 0.66, tw = th * 1.72, dot = f * 0.17, dgap = f * 0.15;
    const u = { item, nameW, th, tw, dot, dgap, a: nameW, b: tw + dgap + dot };
    widest = Math.max(widest, u.a + glue + u.b);
    const lead = x > 0 ? gap : 0;
    if (x + lead + u.a + glue + u.b <= availW) { x += lead; push("name", u, u.a); x += glue; push("thumb", u, u.b); return; }
    if (split && x + lead + u.a <= availW) { x += lead; push("name", u, u.a); newLine(); push("thumb", u, u.b); return; }
    if (x > 0) newLine();
    push("name", u, u.a);
    if (u.a + glue + u.b <= availW) { x += glue; push("thumb", u, u.b); } else { newLine(); push("thumb", u, u.b); }
  });
  return { lines: lines.filter(l => l.length), widest };
}

function layout() {
  const narrow = W < 700;
  const side = narrow ? 16 : Math.max(24, Math.round(W * 0.03));
  const top = narrow ? 88 : 104, bottom = narrow ? 76 : 88;

    Math.abs(tMag - drop.mag) > 0.001 || Math.abs(drop.tblend - drop.blend) > 0.001 ||
    Math.abs(drop.segT - drop.seg) > 0.05 || Math.abs(drop.segV) > 0.5 || Math.abs(drop.portraitT - drop.portrait) > 0.002;
  if (busy || hiBusy) raf = requestAnimationFrame(frame);
}

function draw(sx, sy) {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const R = Math.max(0, drop.r * drop.press);
  gl.viewport(0, 0, cvs.width, cvs.height);
  gl.uniform2f(U.uView, W, H); gl.uniform1f(U.uDpr, dpr);
  gl.uniform2f(U.uA, drop.ax, drop.ay); gl.uniform2f(U.uB, drop.bx, drop.by);
  gl.uniform2f(U.uSrc, sx, sy);
  gl.uniform1f(U.uRA, R); gl.uniform1f(U.uRB, R * 0.6); gl.uniform1f(U.uK, Math.max(0.01, R * 0.8));
  gl.uniform1f(U.uMag, drop.mag);
  gl.uniform2f(U.uSeg, Math.max(0, drop.seg), 0);
  gl.uniform4f(U.uHi0, hi.a[0], hi.a[1], hi.a[2], hi.a[3]);
  gl.uniform4f(U.uHi1, hi.b[0], hi.b[1], hi.b[2], hi.b[3]);
  gl.uniform1f(U.uHiAmt, hi.amt); gl.uniform1f(U.uFeather, hi.feather);
  gl.uniform1f(U.uPortraitOn, drop.portrait);
  gl.uniform1f(U.uBevel, Math.max(8, Math.min(R * 0.34, 58)));
  gl.uniform1f(U.uDim, 0.8);
  gl.uniform2f(U.uTexel, 1 / blurCanvas.width, 1 / blurCanvas.height);
  gl.uniform4f(U.uDRect, detailRect[0], detailRect[1], detailRect[2], detailRect[3]);
  gl.uniform1f(U.uDetailOn, detailOn);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

function hiRects(r) {
  // one capsule around name + preview + dot; two only when the preview wrapped to its own line
  const f = r.f, cap = r.cap, n = r.name, t = r.thumb;
  const ny = n.base - cap * 0.5, ty = t.y + t.h / 2, rad = cap * 0.5 + f * 0.2;
  const end = t.x + r.u.b + f * 0.08;
  if (Math.abs(ty - ny) < 2) return [[n.x - f * 0.06, ny, end, rad], [0, 0, 0, 0]];
  return [[n.x - f * 0.06, ny, n.x + n.w + f * 0.06, rad], [t.x - f * 0.04, ty, end, t.h / 2 + f * 0.1]];
}
function updateHighlight(sx, sy, dt) {
  const r = openRow || snap || spawnHold || !indexEl.hidden ? null : rowAt(sx, sy);
  const ease = (k) => reduced ? 1 : 1 - Math.pow(1 - k, dt * 60);
  if (r) {
    const [ta, tb] = hiRects(r);
    hi.ta = ta; hi.tb = tb; hi.feather = r.f * 0.5;
    if (hi.amt < 0.02) { hi.a = ta.slice(); hi.b = tb.slice(); }
  }
  let moving = false;
  const k = ease(0.2);
  for (let i = 0; i < 4; i++) {
    const da = hi.ta[i] - hi.a[i], db = hi.tb[i] - hi.b[i];
    hi.a[i] += da * k; hi.b[i] += db * k;
    if (Math.abs(da) > 0.2 || Math.abs(db) > 0.2) moving = true;
  }
  const target = r ? 1 : 0;
  hi.amt += (target - hi.amt) * ease(0.14);
  if (Math.abs(target - hi.amt) > 0.003) moving = true; else hi.amt = target;
  return moving;
}
function ui() {}
// the hint is only for the first moments: it fades once the drop has been used
let hintTimer = null;
function hintSeen(delay) {
  if (hint.classList.contains("gone") || hintTimer) return;
  hintTimer = setTimeout(() => hint.classList.add("gone"), delay);
}

/* ============================== INPUT ============================== */
let viaKeyboard = false;
addEventListener("keydown", () => { viaKeyboard = true; }, true);
addEventListener("pointerdown", () => { viaKeyboard = false; }, true);
function focusIfKeyboard(el) { if (el && viaKeyboard && el.focus) el.focus({ preventScroll: true }); }
const pointers = new Map();
let drag = null, pinch = null;
function markInput() { lastInput = performance.now(); guideOn = false; }

function navSnapAt(x, y) {
  const a = btnIndex.getBoundingClientRect(), b = btnAbout.getBoundingClientRect();
  if (!a.width || x < a.left - 90 || y > Math.max(a.bottom, b.bottom) + 56) return null;
  return x < (a.right + b.left) / 2 ? btnIndex : btnAbout;
}
function setSnap(s) {
  if (s === snap) return;
  snap = s;
  btnIndex.classList.toggle("lit", s === btnIndex); btnAbout.classList.toggle("lit", s === btnAbout);
  if (!s) drop.segT = 0;
  kick();
}
let lastMouse = null;
addEventListener("pointermove", (e) => {
  if (e.pointerType === "mouse") lastMouse = [e.clientX, e.clientY];
  if (e.pointerType !== "mouse" || openRow || !indexEl.hidden) return;
  markInput(); hintSeen(6000);
  const s = navSnapAt(e.clientX, e.clientY);
  setSnap(s);
  if (s) {
    const r = s.getBoundingClientRect();
    drop.snapR = r.height / 2 + 1; drop.segT = Math.max(0, r.width / 2 - drop.snapR);
    setTarget(r.left + r.width / 2, r.top + r.height / 2);
  } else setTarget(e.clientX, e.clientY);
});

cvs.addEventListener("pointermove", (e) => {
  if (e.pointerType === "mouse") return;
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && pointers.size >= 2) {
    const [a, b] = [...pointers.values()];
    focus = Math.max(0, Math.min(1, pinch.f + (Math.hypot(a.x - b.x, a.y - b.y) / pinch.d - 1) * 0.8)); kick(); return;
  }
  if (drag) {
    if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 8) drag.moved = true;
    if (drag.moved && !openRow) setTarget(e.clientX + drag.ox, e.clientY + drag.oy);
  }
});

cvs.addEventListener("pointerdown", (e) => {
  markInput();
  if (!openRow) { drop.pressT = 0.9; kick(); }
  if (e.pointerType === "mouse") { drag = { sx: e.clientX, sy: e.clientY, moved: false, mouse: true }; return; }
  cvs.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinch = { d: Math.max(20, Math.hypot(a.x - b.x, a.y - b.y)), f: focus }; drag = null; return; }
  const inside = Math.hypot(e.clientX - drop.ax, e.clientY - drop.ay) < drop.r;
  drag = { sx: e.clientX, sy: e.clientY, moved: false, inside,
    ox: inside ? drop.ax - e.clientX : 0, oy: inside ? drop.ay - e.clientY : -Math.min(drop.r * 0.9, 90) };
});

function endPointer(e) {
  drop.pressT = 1; kick();
  if (e.pointerType !== "mouse") { pointers.delete(e.pointerId); if (pointers.size < 2) pinch = null; }
  if (!drag) return;
  const d = drag; drag = null;
  if (openRow) { if (!d.moved) close(); return; }
  if (d.moved) return;
  if (d.mouse) { if (snap) { snap.click(); return; } const r = rowAt(e.clientX, e.clientY); if (r) open(r); return; }
  if (d.inside) { const r = rowAt(drop.ax, drop.ay); if (r) open(r); }
  else setTarget(e.clientX, e.clientY);
}
cvs.addEventListener("pointerup", endPointer);
cvs.addEventListener("pointercancel", (e) => { pointers.delete(e.pointerId); pinch = null; drag = null; drop.pressT = 1; kick(); });

addEventListener("wheel", (e) => {
  if (!indexEl.hidden || openRow) return;
  e.preventDefault(); markInput(); hintSeen(1200);
  focus = Math.max(0, Math.min(1, focus + e.deltaY * 0.0011)); kick();
}, { passive: false });

addEventListener("keydown", (e) => {
  if (e.key === "Escape") { if (openRow) close(); else if (!indexEl.hidden) toggleIndex(false, ...centre($("#btnBack"))); return; }
  if (snap) setSnap(null);
  if (openRow || !indexEl.hidden || (e.target.closest && e.target.closest("button,a"))) return;
  const cur = rowAt(drop.tx, drop.ty) || rows[0];
  const i = rows.indexOf(cur);
  if (["ArrowDown", "ArrowUp", "ArrowLeft", "ArrowRight"].includes(e.key)) {
    e.preventDefault(); markInput();
    const step = e.key === "ArrowDown" || e.key === "ArrowRight" ? 1 : -1;
    const next = rows[(i + step + rows.length) % rows.length];
    setTarget(next.fx, next.fy);
  } else if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(rowAt(drop.tx, drop.ty) ? cur : null); }
  else if (e.key === "+" || e.key === "=") { focus = Math.max(0, focus - 0.1); kick(); }
  else if (e.key === "-") { focus = Math.min(1, focus + 0.1); kick(); }
});

// idle guide: the drop drifts from name to name until someone takes it
setInterval(() => {
  if (!glOK || reduced || openRow || !indexEl.hidden || !rows.length) return;
  if (!guideOn && performance.now() - lastInput < 9000) return;
  guideOn = true;
  setSnap(null);
  const r = rows[guideIdx++ % rows.length];
  setTarget(phone ? W / 2 : r.fx, r.fy);
}, 3000);

/* ============================== SHEET / INDEX ============================== */
function esc(s) { return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function sheetHTML(item) {
  const head = (k) => `<button class="close" id="closeBtn" aria-label="Close">×</button><div class="sheet-scroll"><div class="sheet-head"><span class="kind">${k}</span></div>`;
  if (item === ME) return `${head("About")}
    <h2 id="sheetTitle">Přemek Kosař</h2>
    <p class="lede">I design and build websites, and the systems behind them.</p>
    <p class="body">Graphics, photo and video since 2017, with my first paid jobs at eleven. The last two years have been the web: client sites, Shopify stores, real-time games and small products of my own. AI is part of how I work every day, which is why things ship fast without getting sloppy.</p>
    <dl class="facts">
      <div><dt>Based</dt><dd>Náchod, Czechia. In Prague when a project needs it.</dd></div>
      <div><dt>Build</dt><dd><div class="chips"><span>HTML/CSS/JS</span><span>React</span><span>Node.js</span><span>Three.js</span><span>Shopify</span></div></dd></div>
      <div><dt>Make</dt><dd><div class="chips"><span>Photoshop</span><span>Firefly</span><span>Photo</span><span>Video</span><span>Social</span></div></dd></div>
      <div><dt>Contact</dt><dd><div class="copyrow"><code>contact@prmvisual.fun</code><button id="copyMail">Copy</button></div></dd></div>
    </dl>
    <a class="visit" href="https://instagram.com/prmvisual" target="_blank" rel="noopener">Instagram @prmvisual</a>
    <p class="motto">NO HALF-MEASURES. EVER.</p></div>`;
  return `${head(esc(item.kind))}
    <h2 id="sheetTitle">${esc(item.title)}</h2>
    <p class="lede">${esc(item.lede)}</p>
    <p class="body">${esc(item.body)}</p>
    <dl class="facts">
      <div><dt>Status</dt><dd><span class="status" style="--dot:${STATUS[item.status]}"><i></i>${esc(item.status)}</span></dd></div>
      <div><dt>What I did</dt><dd><ul>${item.did.map(d => `<li>${esc(d)}</li>`).join("")}</ul></dd></div>
      <div><dt>Stack</dt><dd><div class="chips">${item.stack.map(s => `<span>${esc(s)}</span>`).join("")}</div></dd></div>
    </dl>
    <div class="links">${(item.links || (item.link ? [item.link] : [])).map((l, i) => `<a class="visit${i ? " ghost" : ""}" href="${l.href}" target="_blank" rel="noopener">${esc(l.label)} ↗</a>`).join("")}</div></div>`;
}

let returnFocus = null;
function selectMail() { const code = sheet.querySelector("code"); const r = document.createRange(); r.selectNodeContents(code); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }

function open(r) {
  if (!r) return;
  markInput();
  setSnap(null); drop.segT = 0;
  openRow = r;
  returnFocus = document.activeElement;
  sheet.innerHTML = sheetHTML(r.item); sheet.hidden = false; document.body.classList.add("is-open");
  $("#closeBtn").addEventListener("click", close);
  const cm = $("#copyMail");
  if (cm) cm.addEventListener("click", () => {
    const done = () => { cm.textContent = "Copied"; setTimeout(() => cm.textContent = "Copy", 1600); };
    try { navigator.clipboard.writeText("contact@prmvisual.fun").then(done, selectMail); } catch (_) { selectMail(); }
  });
  const sr = sheet.getBoundingClientRect();
  const narrow = W < 700;
  const free = narrow ? { w: W, h: Math.max(140, sr.top) } : { w: sr.left, h: H };
  let ax = free.w / 2, ay = free.h / 2 + (narrow ? 10 : 0);
  drop.openR = Math.hypot(W, H) * 1.25; drop.tblend = 1; drop.portraitT = 0;
  if (r.item === ME) {
    // About: the drop settles beside the text as a big lens and shows who is behind the work
    const topSafe = narrow ? 76 : 0;
    ay = narrow ? topSafe + (free.h - topSafe) / 2 : H / 2;
    drop.openR = narrow ? Math.max(70, Math.min(W * 0.42, (free.h - topSafe) * 0.44)) : Math.min(free.w * 0.36, H * 0.38);
    drop.portraitT = 1;
    // About: the drop spreads over everything at 1:1, so the whole surface comes into focus
    drop.ox = ax; drop.oy = ay; drop.openMag = 1; detailOn = 0;
  } else {
    // a project: the drop spreads and holds its preview large in the free space
    const t = r.thumb;
    drop.ox = t.x + t.w / 2; drop.oy = t.y + t.h / 2;
    drop.openMag = Math.max(1.2, Math.min(free.w * 0.78 / t.w, free.h * 0.62 / t.h, 6));
    if (glOK) {
      const m = drop.openMag, dpr = Math.min(devicePixelRatio || 1, 2);
      const x0 = drop.ox - ax / m, y0 = drop.oy - ay / m, w = W / m, h = H / m;
      const pad = 0.08, rx = x0 - w * pad, ry = y0 - h * pad, rw = w * (1 + 2 * pad), rh = h * (1 + 2 * pad);
      const maxTex = Math.min(gl.getParameter(gl.MAX_TEXTURE_SIZE), 4096);
      renderDetail(rx, ry, rw, rh, Math.min(dpr * m, maxTex / rw, maxTex / rh));
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
      gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, texDetail);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, detail);
      detailOn = 1;
    }
  }
  setTarget(ax, ay);
  focusIfKeyboard($("#closeBtn"));
}

function close() {
  if (!openRow) return;
  const r = openRow; openRow = null;
  sheet.hidden = true; sheet.innerHTML = ""; document.body.classList.remove("is-open");
  drop.tblend = 0; drop.portraitT = 0;
  if (r.item !== ME) setTarget(r.fx, r.fy);
  lastInput = performance.now();
  focusIfKeyboard(returnFocus);
}

const ABOUT = { item: ME };

function buildIndex() {
  const ol = $("#indexList");
  ol.innerHTML = WORK.map((w, i) => `<li><button data-i="${i}"><span class="it">${esc(w.title)}</span><span class="ik" style="--dot:${STATUS[w.status]}">${esc(w.kind.toLowerCase().includes(w.status.toLowerCase()) ? w.kind.replace(new RegExp("\\s*·\\s*" + w.status, "i"), "") : w.kind)}<i aria-hidden="true"></i>${esc(w.status)}</span></button></li>`).join("");
  ol.addEventListener("click", (e) => {
    const b = e.target.closest("button[data-i]"); if (!b) return;
    const item = WORK[+b.dataset.i];
    const br = b.getBoundingClientRect();
    toggleIndex(false, 60 + Math.min(br.width * 0.25, 300), br.top + br.height / 2, false);
    const r = rows.find(x => x.item === item);
    if (glOK) { drop.ax = drop.bx = r.fx; drop.ay = drop.by = r.fy; }
    open(r);
  });
}

// the index pours out of the Index button and drains back into whatever sends you home
let indexTimer = null;
function toggleIndex(show, ox, oy, toCanvas = true) {
  if (openRow) close();
  setSnap(null);
  clearTimeout(indexTimer);
  const btnBack = $("#btnBack");
  if (ox !== undefined) {
    // move the circle's centre while it still covers everything, so the shrink starts at once and ends in the button
    const cover = Math.max(Math.hypot(ox, oy), Math.hypot(W - ox, oy), Math.hypot(ox, H - oy), Math.hypot(W - ox, H - oy)) + 2;
    indexEl.style.transition = "none";
    indexEl.style.setProperty("--ox", ox + "px"); indexEl.style.setProperty("--oy", oy + "px");
    indexEl.style.setProperty("--rmax", cover + "px");
    indexEl.getBoundingClientRect();
    indexEl.style.transition = "";
  }
  document.body.classList.toggle("is-index", show);
  btnIndex.setAttribute("aria-pressed", String(show));
  if (show) {
    spawnHold = false;
    btnBack.classList.remove("sink");
    indexEl.hidden = false;
    indexEl.getBoundingClientRect();
    requestAnimationFrame(() => indexEl.classList.add("shown"));
    btnBack.hidden = false;
    focusIfKeyboard(indexEl.querySelector("button"));
  } else {
    indexEl.classList.remove("shown");
    btnBack.classList.add("sink");
    if (toCanvas && glOK) {
      // park the drop, invisible, where the pointer is; it grows back once the index is gone
      const [px, py] = lastMouse || [ox ?? W / 2, oy ?? H / 2];
      drop.ax = drop.bx = drop.tx = px; drop.ay = drop.by = drop.ty = py;
      drop.avx = drop.avy = drop.bvx = drop.bvy = 0;
      drop.r = 0; drop.rv = 0; drop.seg = drop.segT = 0; drop.segV = 0;
      hi.amt = 0;
      spawnHold = true;
    }
    let done = false;
    const finish = () => {
      if (done) return; done = true;
      indexEl.removeEventListener("transitionend", onEnd);
      indexEl.hidden = true; btnBack.hidden = true; btnBack.classList.remove("sink");
      // wait one frame so the canvas is on screen before the drop starts to grow
      requestAnimationFrame(() => { spawnHold = false; lastInput = performance.now(); lastT = performance.now(); kick(); });
    };
    const onEnd = (e) => { if (e.target === indexEl && e.propertyName === "clip-path") finish(); };
    indexEl.addEventListener("transitionend", onEnd);
    indexTimer = setTimeout(finish, reduced ? 0 : 780);
    if (!openRow) focusIfKeyboard(btnIndex);
  }
  kick();
}
function centre(el) { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; }
btnIndex.addEventListener("click", () => { if (glOK && indexEl.hidden) toggleIndex(true, ...centre(btnIndex)); });
$("#btnBack").addEventListener("click", () => toggleIndex(false, ...centre($("#btnBack"))));
btnAbout.addEventListener("click", () => { if (!indexEl.hidden) toggleIndex(false, undefined, undefined, false); if (openRow) close(); open(ABOUT); });

/* ============================== BOOT ============================== */
function resize() {
  W = innerWidth; H = innerHeight;
  const dpr = Math.min(devicePixelRatio || 1, 2);
  cvs.width = Math.round(W * dpr); cvs.height = Math.round(H * dpr);
  layout();
  if (glOK) { buildField(gl.getParameter(gl.MAX_TEXTURE_SIZE)); uploadTextures(); }
  if (openRow) { const r = openRow.item === ME ? ABOUT : rows.find(x => x.item === openRow.item); openRow = null; open(r); }
  kick();
}

async function boot() {
  buildIndex();
  const fonts = [`600 60px Geist`, `700 20px Geist`, `500 12px Geist`];
  try { await Promise.race([Promise.all(fonts.map(f => document.fonts.load(f, "PRMřČé"))), new Promise(r => setTimeout(r, 2500))]); } catch (_) {}
  if (glOK) { try { initGL(); } catch (err) { console.error(err); glOK = false; } }
  if (!glOK) {
    $("#nogl").hidden = false; cvs.hidden = true; hint.hidden = true;
    indexEl.hidden = false; indexEl.classList.add("shown"); btnIndex.hidden = true; layout(); return;
  }
  W = innerWidth; H = innerHeight; layout();
  const start = phone ? { fx: W / 2, fy: H / 2 } : rows[0];
  drop.ax = drop.bx = drop.tx = start.fx; drop.ay = drop.by = drop.ty = start.fy;
  const ft = focusTargets(); drop.r = ft.r; drop.mag = ft.mag;
  booted = true;
  resize();
  if (reduced) toggleIndex(true, W - 60, 40);
  let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(resize, 140); });
  if (document.fonts && document.fonts.addEventListener) document.fonts.addEventListener("loadingdone", () => { if (glOK) { layout(); buildField(gl.getParameter(gl.MAX_TEXTURE_SIZE)); uploadTextures(); kick(); } });
}
boot();
})();
</script>
