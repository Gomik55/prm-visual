<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
<style>
  :root {
    color-scheme: dark;
    --ink: #0d0d0e;
    --paper: #f2f2ef;
    --dim: rgba(242, 242, 239, 0.6);
    --faint: rgba(242, 242, 239, 0.34);
    --line: rgba(242, 242, 239, 0.12);
    --glass: rgba(24, 24, 26, 0.56);
    --sans: "Geist", "Helvetica Neue", Arial, system-ui, sans-serif;
    --mono: var(--sans);   /* labels now use Geist too: one typeface across the site */
  }
  [hidden] { display: none !important; }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--ink);
    color: var(--paper);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: none; }
  #gl.touch, body.is-open #gl { cursor: default; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  :focus-visible { outline: 1.5px solid var(--paper); outline-offset: 3px; border-radius: 999px; }

  /* ---------- glass material (CSS approximation for UI chrome) ---------- */
  .glass {
    background: var(--glass);
    -webkit-backdrop-filter: blur(30px) saturate(1.7);
    backdrop-filter: blur(30px) saturate(1.7);
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.16),
      inset 0 -1px 0 rgba(255, 255, 255, 0.04),
      0 18px 50px rgba(0, 0, 0, 0.42);
  }

  /* ---------- HUD ---------- */
  .hud {
    position: fixed; left: 0; right: 0; z-index: 7;
    display: flex; justify-content: space-between; align-items: center; gap: 16px;
    padding-inline: max(16px, 3vw);
    pointer-events: none;
  }
  .hud > * { pointer-events: auto; }
  @media (pointer: fine) {
    /* on the canvas the drop is the cursor, including over the header and the nav */
    .hud, .hud * { cursor: none; }
    .hud { user-select: none; -webkit-user-select: none; }
  }
  .mark, .hud-bottom { transition: opacity .3s; }
  body.is-open .mark, body.is-open .hud-bottom, body.is-index .hud-bottom { opacity: 0; pointer-events: none; }
  .hud-top { top: 0; padding-top: calc(env(safe-area-inset-top, 0px) + 20px); }
  .hud-bottom { bottom: 0; align-items: flex-end; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); }
  .hud-top { transition: opacity .3s; }
  body.is-index .hud-top, body.is-index .hud-bottom { opacity: 0; pointer-events: none; }

  .mark { font-weight: 600; font-size: 18px; letter-spacing: -0.03em; }

  /* nav: plain words; the drop itself becomes their highlight */
  .nav { display: flex; gap: 4px; }
  .nav button {
    padding: 8px 16px; border-radius: 999px;
    font-size: 14px; font-weight: 500; letter-spacing: -0.01em;
    color: rgba(242, 242, 239, 0.72);
    transition: color .25s;
  }
  .nav button:hover, .nav button.lit { color: var(--paper); }
  @media (pointer: coarse) {
    .nav {
      padding: 4px; border-radius: 999px;
      background: var(--glass);
      -webkit-backdrop-filter: blur(30px) saturate(1.7); backdrop-filter: blur(30px) saturate(1.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16), 0 12px 30px rgba(0, 0, 0, 0.4);
    }
    .nav button { color: var(--paper); }
  }
  .hint { font-size: 13px; color: var(--dim); max-width: 36ch; margin: 0; letter-spacing: -0.005em; }
  .hint { transition: opacity .8s ease; }
  .hint.gone { opacity: 0; }


  /* ---------- case study sheet ---------- */
  #sheet {
    position: fixed; z-index: 8;
    top: calc(env(safe-area-inset-top, 0px) + 16px);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
    right: 16px;
    width: min(460px, calc(100% - 32px));
    overflow: hidden;
    border-radius: 30px;
    display: flex; flex-direction: column;
    animation: rise .5s cubic-bezier(.2, .9, .25, 1);
  }
  .sheet-scroll {
    flex: 1 1 auto; min-height: 0; overflow-y: auto;
    padding: 28px 30px 32px;
    display: flex; flex-direction: column; gap: 22px;
  }
  @keyframes rise { from { transform: translateY(18px) scale(.98); opacity: 0; } }
  .sheet-head { display: flex; align-items: center; min-height: 34px; padding-right: 48px; }
  .kind, .facts dt, #index .ik, .motto { font-weight: 500; font-variant-numeric: tabular-nums; }
  .kind { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); }
  .close {
    position: absolute; z-index: 2; top: 24px; right: 26px;
    width: 34px; height: 34px; border-radius: 50%;
    display: grid; place-items: center;
    background: rgba(48, 48, 52, 0.72);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14), 0 4px 14px rgba(0, 0, 0, 0.35);
    font-size: 18px; line-height: 1;
    transition: background-color .2s;
  }
  .close:hover { background: rgba(70, 70, 76, 0.8); }
  #sheet h2 {
    font-weight: 600; font-size: clamp(46px, 6vw, 68px);
    line-height: 0.92; letter-spacing: -0.05em;
    margin: 0; text-wrap: balance;
  }
  .lede { font-size: 20px; font-weight: 500; line-height: 1.3; letter-spacing: -0.02em; margin: 0; text-wrap: pretty; }
  .body { font-size: 15px; color: var(--dim); margin: 0; text-wrap: pretty; }
  .facts { display: grid; gap: 0; margin: 0; }
  .facts > div { display: grid; grid-template-columns: 96px 1fr; gap: 14px; padding-block: 13px; border-top: 1px solid var(--line); }
  .facts dt { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); padding-top: 3px; }
  .facts dd { margin: 0; font-size: 14.5px; }
  .facts ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips span { font-family: var(--mono); font-size: 11.5px; padding: 4px 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.07); }
  .status { display: inline-flex; align-items: center; gap: 8px; }
  .status i { width: 9px; height: 9px; border-radius: 50%; background: var(--dot, var(--paper)); }
  .visit {
    align-self: flex-start; text-decoration: none; color: var(--ink); background: var(--paper);
    font-size: 14px; font-weight: 600; letter-spacing: -0.01em;
    padding: 10px 18px; border-radius: 999px;
    transition: transform .2s;
  }
  .visit:hover { transform: translateY(-1px); }
  .links { display: flex; flex-wrap: wrap; gap: 8px; }
  .links:empty { display: none; }
  .visit.ghost { background: rgba(255, 255, 255, 0.1); color: var(--paper); }
  .copyrow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .copyrow code { font-family: var(--mono); font-size: 13.5px; user-select: all; }
  .copyrow button { font-size: 12.5px; font-weight: 500; padding: 4px 11px; border-radius: 999px; background: rgba(255, 255, 255, 0.1); }
  .motto { font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.1em; color: var(--faint); margin: 0; }

  /* ---------- index ---------- */
  #index {
    position: fixed; inset: 0; z-index: 6;
    background: var(--ink);
    overflow-y: auto;
    will-change: clip-path;
    contain: paint;
    padding-inline: max(16px, 3vw);
    padding-block: calc(env(safe-area-inset-top, 0px) + 40px) 150px;
    clip-path: circle(0px at var(--ox, 90%) var(--oy, 4%));
    transition: clip-path .66s cubic-bezier(.55, 0, .25, 1);
  }
  #index.shown { clip-path: circle(var(--rmax, 200vmax) at var(--ox, 90%) var(--oy, 4%)); }
  #index .ik { display: inline-flex; align-items: center; gap: 10px; }
  #index .ik i { width: 9px; height: 9px; border-radius: 50%; background: var(--dot); }

  #btnBack {
    position: fixed; z-index: 9; left: 50%;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
    display: flex; align-items: center; gap: 10px;
    padding: 12px 26px; border-radius: 999px;
    font-size: 14px; font-weight: 500; letter-spacing: -0.01em;
    transform: translateX(-50%);
    transition: transform .45s cubic-bezier(.3, 1.6, .45, 1), opacity .25s ease .5s;
    animation: pop .6s cubic-bezier(.3, 1.6, .45, 1) .25s both;
  }
  #btnBack:hover { transform: translateX(-50%) scale(1.07); }
  #btnBack.sink { transform: translateX(-50%) scale(.82); opacity: 0; pointer-events: none; }
  @keyframes pop { from { transform: translateX(-50%) scale(.4); opacity: 0; } }
  #index ol { list-style: none; margin: 0; padding: 0; }
  #index li { border-top: 1px solid var(--line); }
  #index button {
    width: 100%; text-align: left;
    display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 24px;
    padding-block: 14px 16px;
  }
  #index .it { font-weight: 600; font-size: clamp(34px, 6.4vw, 72px); line-height: 1; letter-spacing: -0.05em; transition: transform .35s cubic-bezier(.2, .9, .25, 1); }
  #index button:hover .it, #index button:focus-visible .it { transform: translateX(12px); }
  #index .ik { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); }

  #nogl { position: fixed; inset: 0; display: grid; place-items: center; padding-inline: 16px; text-align: center; color: var(--dim); }

  /* ---------- Photo & Video: the light table ---------- */
  @media (pointer: fine) { body.is-gallery #gl { cursor: none; } }
  .more { display: none; margin-left: auto; font-size: 12.5px; font-weight: 500; padding: 5px 12px; border-radius: 999px; background: rgba(255, 255, 255, 0.1); }
  #sheet.mini { max-height: none; }
  #sheet.mini .sheet-scroll { gap: 4px; padding-block: 18px 20px; overflow: hidden; }
  #sheet.mini .sheet-scroll > :not(.sheet-head):not(h2) { display: none; }
  #sheet.mini h2 { font-size: 34px; }

  /* lightbox: the frame lifts off the table under a sheet of glass */
  #lb { position: fixed; inset: 0; z-index: 10; }
  .lb-scrim { position: absolute; inset: 0; background: rgba(9, 9, 10, 0.9); opacity: 0; transition: opacity .45s ease; }
  #lb.on .lb-scrim { opacity: 1; }
  .lb-frame {
    position: absolute; left: 0; top: 0; margin: 0;
    border-radius: 16px; overflow: hidden; background: #111;
    transform-origin: 0 0; will-change: transform;
    box-shadow: 0 40px 120px rgba(0, 0, 0, 0.62);
    touch-action: none;
  }
  .lb-frame.tilt { transition: transform .5s cubic-bezier(.2, .9, .25, 1); }
  .lb-frame img, .lb-frame video { display: block; width: 100%; height: 100%; object-fit: cover; user-select: none; -webkit-user-drag: none; }
  .lb-frame video { cursor: pointer; }
  /* the glass: a bevelled rim and a glint that follows the light */
  .lb-frame::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.34), inset 0 -1px 0 rgba(255, 255, 255, 0.06);
    background: radial-gradient(120% 90% at var(--gx, 30%) var(--gy, 0%), rgba(255, 255, 255, 0.13), rgba(255, 255, 255, 0) 46%);
    mix-blend-mode: screen;
  }
  .lb-frame.glint::before {
    content: ""; position: absolute; inset: -20%; z-index: 1; pointer-events: none;
    background: linear-gradient(105deg, rgba(255, 255, 255, 0) 38%, rgba(255, 255, 255, 0.22) 48%, rgba(255, 255, 255, 0) 58%);
    mix-blend-mode: screen;
    animation: glint 1.1s cubic-bezier(.3, .6, .2, 1) .12s both;
  }
  @keyframes glint { from { transform: translateX(-60%); } to { transform: translateX(60%); } }
  .lb-prog { position: absolute; left: 14px; right: 14px; bottom: 12px; height: 2px; border-radius: 2px; background: rgba(255, 255, 255, 0.22); z-index: 2; pointer-events: none; }
  .lb-prog b { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--paper); }
  .lb-ui { transition: opacity .3s ease; opacity: 0; }
  #lb.on .lb-ui { opacity: 1; transition-delay: .18s; }
  .lb-meta {
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 84px);
    width: max-content; max-width: calc(100% - 32px);
    display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline; gap: 4px 14px;
    font-size: 11px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; font-variant-numeric: tabular-nums;
    color: var(--faint); text-align: center;
  }
  .lb-meta b { font-weight: 500; color: var(--paper); }
  .lb-meta span { text-transform: none; letter-spacing: 0.01em; font-size: 12px; }   /* camera readouts keep their own case: α6100, f/8 */
  .lb-bar {
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
    display: flex; align-items: center; gap: 2px; padding: 5px; border-radius: 999px;
  }
  .lb-bar button { display: grid; place-items: center; height: 36px; min-width: 36px; border-radius: 999px; transition: background-color .2s; }
  .lb-bar button:hover { background: rgba(255, 255, 255, 0.1); }
  .lb-bar svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .lb-count { min-width: 74px; text-align: center; font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
  .lb-count i { font-style: normal; color: var(--faint); }
  .lb-bar .lb-sound { padding-inline: 14px; font-size: 12.5px; font-weight: 500; background: rgba(255, 255, 255, 0.1); margin-left: 4px; }
  .lb-close { top: calc(env(safe-area-inset-top, 0px) + 20px); right: 20px; }

  @media (max-width: 700px) {
    #index button { flex-direction: column; align-items: flex-start; justify-content: flex-start; gap: 8px; padding-block: 14px 16px; }
    #index .it { font-size: clamp(34px, 10.5vw, 48px); }
    #sheet {
      top: auto; left: 10px; right: 10px; bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
      width: auto; max-height: 64%;
      border-radius: 28px;
    }
    .sheet-scroll { padding: 22px 22px 26px; gap: 18px; }
    .close { top: 18px; right: 18px; }
    .facts > div { grid-template-columns: 1fr; gap: 6px; }
    .hint { max-width: 24ch; }
    .mark { font-size: 17px; }
    .more { display: inline-block; }
    .lb-meta { bottom: calc(env(safe-area-inset-bottom, 0px) + 80px); }
    .lb-close { top: calc(env(safe-area-inset-top, 0px) + 14px); right: 14px; }
  }
  @media (max-width: 700px), (pointer: coarse) {
    .hud-bottom { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    #sheet { animation: none; }
    #index .it { transition: none; }
    #index { transition: none; }
    #btnBack { animation: none; }
    .lb-scrim, .lb-ui, .lb-frame.tilt { transition: none; }
    .lb-frame.glint::before { animation: none; display: none; }
  }
</style>
</head>
<body>

/* ---------- the aperture: one piece of maths for the Photo & Video icon and the iris that opens it ----------

const IRIS_RING = 2.4, IRIS_TWIST = 0.9;

  const r = Math.hypot(dx, dy), a = Math.atan2(dy, dx) - rot, seg = Math.PI / 3;

function apertureSprite(ringPx, s) {
  const key = Math.round(ringPx * 2) / 2;
  if (apCache.has(key)) return apCache.get(key);
  const S = Math.ceil(key * 2 + 4), cv = document.createElement("canvas"); cv.width = cv.height = S;
  const x = cv.getContext("2d"), img = x.createImageData(S, S), d = img.data, ap = key / IRIS_RING, c0 = S / 2;
  for (let j = 0; j < S; j++) for (let i = 0; i < S; i++) {
    const dx = i + 0.5 - c0, dy = j + 0.5 - c0, q = apertureAt(dx, dy, ap, 0, s), o = (j * S + i) * 4;
    const bl = 0.7 + 0.9 * q.tw, sh = 18 * q.tw * q.tw;             // smoked graphite blades, lit toward their trailing edge
    const t = Math.min(1, Math.hypot(dx, dy) / (ap * 1.15));          // warm light through the opening
    const hr = 255 + (214 - 255) * t, hg = 244 + (160 - 244) * t, hb = 224 + (98 - 224) * t;

    d[o + 1] = Math.min(255, (23 * bl + sh) * (1 - q.hole) + hg * q.hole + L);

        c.fillStyle = "rgba(255,255,255,.06)"; for (let s = 0; s < 6; s++) if (s % 2) c.fillRect(fx, fy + s * fh / 6, fw, fh / 6);
        c.strokeStyle = "rgba(255,255,255,.8)"; c.lineWidth = Math.max(0.5, fw * 0.025);
        c.strokeRect(fx + fw * 0.12, fy + fh * 0.12, fw * 0.76, fh * 0.76);
        c.beginPath(); c.moveTo(fx + fw * 0.12, fy + fh / 2); c.lineTo(fx + fw * 0.88, fy + fh / 2); c.stroke();
        c.beginPath(); c.arc(fx + fw / 2, fy + fh / 2, fw * 0.16, 0, 7); c.stroke();
      } else if (k === "sport") {                // under the lights
        let gg = c.createLinearGradient(fx, fy, fx, fy + fh); gg.addColorStop(0, "#2a3f8f"); gg.addColorStop(1, "#0c1433");
        c.fillStyle = gg; c.fillRect(fx, fy, fw, fh);
        for (let b = 0; b < 5; b++) { const bx = fx + fw * (0.15 + b * 0.18), by = fy + fh * 0.16; const bg = c.createRadialGradient(bx, by, 0, bx, by, fw * 0.16); bg.addColorStop(0, "rgba(220,230,255,.55)"); bg.addColorStop(1, "rgba(220,230,255,0)"); c.fillStyle = bg; c.fillRect(bx - fw * 0.2, by - fw * 0.2, fw * 0.4, fw * 0.4); }

        c.beginPath(); c.moveTo(fx + fw * 0.3, fy + fh); c.quadraticCurveTo(fx + fw * 0.32, fy + fh * 0.6, fx + fw * 0.52, fy + fh * 0.6); c.quadraticCurveTo(fx + fw * 0.72, fy + fh * 0.6, fx + fw * 0.74, fy + fh); c.fill();
      } else {                                   // real estate at dusk
        let gg = c.createLinearGradient(fx, fy, fx, fy + fh); gg.addColorStop(0, "#7C9BFF"); gg.addColorStop(0.55, "#3a3f6a"); gg.addColorStop(1, "#15161f");
        c.fillStyle = gg; c.fillRect(fx, fy, fw, fh);

        c.beginPath(); c.moveTo(fx + fw * 0.1, fy + fh * 0.72); c.lineTo(fx + fw * 0.1, fy + fh * 0.55); c.lineTo(fx + fw * 0.45, fy + fh * 0.4); c.lineTo(fx + fw * 0.8, fy + fh * 0.55); c.lineTo(fx + fw * 0.8, fy + fh * 0.72); c.closePath(); c.fill();
        c.fillRect(fx, fy + fh * 0.72, fw, fh * 0.28);

      for (let s = 0; s < 3; s++) { c.fillStyle = s <= i ? "rgba(255,255,255,.85)" : "rgba(255,255,255,.3)"; rr(c, fx + fw * (0.08 + s * 0.29), fy + fh * 0.04, fw * 0.26, Math.max(0.6, fh * 0.012), fh * 0.006); c.fill(); }

  },

  // claude — pure black, a peak breaking through the clouds, the stretched C floating above it: "Made to float"
  // claude — the first collection floating over black, the stretched C above: "Made to float"
  claude(c, x, y, w, h) {
    c.fillStyle = "#000"; c.fillRect(x, y, w, h);
    const spot = c.createRadialGradient(x + w / 2, y + h * 0.5, 0, x + w / 2, y + h * 0.5, w * 0.55);
    spot.addColorStop(0, "#2e2e33"); spot.addColorStop(1, "#000");
    c.fillStyle = spot; c.fillRect(x, y, w, h);
    const floor = y + h * 0.92;
    const piece = (img, cx, ph, lift) => {
      if (!img) return;
      const pw = ph * img.width / img.height, bottom = floor - lift;
      const sg = c.createRadialGradient(cx, floor, 0, cx, floor, pw * 0.5);   // soft shadow on the floor
      sg.addColorStop(0, "rgba(0,0,0,.75)"); sg.addColorStop(1, "rgba(0,0,0,0)");
      c.save(); c.translate(cx, floor); c.scale(1, 0.16); c.fillStyle = sg; c.beginPath(); c.arc(0, 0, pw * 0.5, 0, 7); c.fill(); c.restore();
      c.drawImage(img, cx - pw / 2, bottom - ph, pw, ph);
    };
    piece(IMG.claude_ls, x + w * 0.23, h * 0.42, h * 0.1);
    piece(IMG.claude_pants, x + w * 0.79, h * 0.56, h * 0.08);
    piece(IMG.claude_zip, x + w * 0.5, h * 0.58, h * 0.12);
    if (IMG.claude_logo) {
      const lw = w * 0.13, lh = lw * IMG.claude_logo.height / IMG.claude_logo.width;
      c.drawImage(IMG.claude_logo, x + (w - lw) / 2, y + h * 0.075, lw, lh);
    }
  },

  games(c, x, y, w, h, R) {
    c.fillStyle = "#0b100d"; c.fillRect(x, y, w, h);
    const glow = c.createRadialGradient(x + w / 2, y + h * 0.55, 0, x + w / 2, y + h * 0.55, w * 0.6);
    glow.addColorStop(0, "rgba(127,199,150,.16)"); glow.addColorStop(1, "rgba(127,199,150,0)");
    c.fillStyle = glow; c.fillRect(x, y, w, h);
    const pad = w * 0.045, gap = w * 0.03, sw = (w - pad * 2 - gap * 2) / 3, sh = h * 0.7, sy = y + h * 0.1;
    const names = ["KOGAR.IO", "KOTHER.IO", "PRMBLOCKS"];
    for (let i = 0; i < 3; i++) {
      const sx = x + pad + i * (sw + gap);
      c.save(); rr(c, sx, sy, sw, sh, sw * 0.12); c.fillStyle = "#101713"; c.fill(); c.clip();
      // grid
      c.strokeStyle = "rgba(255,255,255,.05)"; c.lineWidth = 1;
      for (let gx = sx; gx < sx + sw; gx += sw / 7) { c.beginPath(); c.moveTo(gx, sy); c.lineTo(gx, sy + sh); c.stroke(); }
      for (let gy = sy; gy < sy + sh; gy += sw / 7) { c.beginPath(); c.moveTo(sx, gy); c.lineTo(sx + sw, gy); c.stroke(); }
      if (i === 0) {
        const cols = ["#7fc796", "#e08aab", "#8aa8e0", "#e0c98a"];
        [[0.45, 0.5, 0.26], [0.18, 0.2, 0.07], [0.82, 0.28, 0.09], [0.22, 0.82, 0.08], [0.8, 0.78, 0.06], [0.6, 0.14, 0.04], [0.12, 0.55, 0.04]].forEach(([fx, fy, fr], k) => {
          c.fillStyle = cols[k % 4]; c.beginPath(); c.arc(sx + sw * fx, sy + sh * fy, sw * fr, 0, 7); c.fill();
          c.strokeStyle = "rgba(0,0,0,.25)"; c.lineWidth = sw * 0.02; c.stroke();
        });
      } else if (i === 1) {
        for (let k = 22; k >= 0; k--) {
          const t = k / 22, px = sx + sw * (0.5 + Math.sin(t * 5.2 + 0.6) * 0.3), py = sy + sh * (0.14 + 0.72 * t);
          c.fillStyle = k === 0 ? "#f3b7cb" : (k % 2 ? "#e08aab" : "#c97796");
          c.beginPath(); c.arc(px, py, sw * (0.085 - t * 0.04), 0, 7); c.fill();
          if (k === 0) { c.fillStyle = "#101713"; c.beginPath(); c.arc(px - sw * 0.03, py + sw * 0.02, sw * 0.015, 0, 7); c.arc(px + sw * 0.03, py + sw * 0.02, sw * 0.015, 0, 7); c.fill(); }
        }
        c.fillStyle = "#e0c98a"; [[0.8, 0.2], [0.25, 0.85], [0.7, 0.9]].forEach(([fx, fy]) => { c.beginPath(); c.arc(sx + sw * fx, sy + sh * fy, sw * 0.03, 0, 7); c.fill(); });
      } else {
        const n = 5, cell = (sw * 0.8) / n, ox = sx + sw * 0.1, oy = sy + (sh - cell * n) / 2;
        const cols = ["#ec8a68", "#6fb8ab", "#dcb45c", "#a99ade"];
        for (let a = 0; a < n; a++) for (let b = 0; b < n; b++) {
          rr(c, ox + a * cell + 1, oy + b * cell + 1, cell - 2, cell - 2, cell * 0.2);

      c.fillStyle = "rgba(242,242,239,.55)"; c.font = `600 ${h * 0.055}px ${FONT}`; spacing(c, "0.16em"); c.textAlign = "center";
      c.fillText(names[i], sx + sw / 2, y + h * 0.92); c.textAlign = "left"; spacing(c, "0px");
    }
  },

  // Photo & Video — two marks: an aperture for the photos, a play button for the film.
  // The aperture is the same one that opens into the light table (see apertureOf / iris in the shader).
  photo(c, x, y, w, h) {
    const g = c.createLinearGradient(x, y, x, y + h);
    g.addColorStop(0, "#23242a"); g.addColorStop(1, "#111215");
    c.fillStyle = g; c.fillRect(x, y, w, h);
    const A = apertureOf({ x, y, w, h });
    const leak = c.createRadialGradient(A.cx, A.cy, 0, A.cx, A.cy, A.ring * 2.2);
    leak.addColorStop(0, "rgba(242,226,196,.16)"); leak.addColorStop(1, "rgba(242,226,196,0)");
    c.fillStyle = leak; c.fillRect(x, y, w, h);
    // the aperture, drawn per pixel so it matches the shader exactly
    const s = c.getTransform().a || 1, spr = apertureSprite(A.ring * s, s);
    c.drawImage(spr, A.cx - spr.width / s / 2, A.cy - spr.height / s / 2, spr.width / s, spr.height / s);

    const px = x + w * 0.72, R = A.ring;

    c.fill(); c.stroke(); c.lineJoin = "miter";
  },

  // ONCE — the intro mark (circle, a single stroke, the name) with a few signatures around it
  once(c, x, y, w, h, R) {
    c.fillStyle = "#0c0e12"; c.fillRect(x, y, w, h);
    const cx = x + w / 2, cy = y + h / 2, r = h * 0.38;
    // signatures on the plate, outside the mark
    const inks = ["#8c9ee8", "#ec8a68", "#7fc796", "#e8e2d6", "#c9a0ff", "#f2c14e"];
    const spots = [[0.1, 0.24, 1.0], [0.07, 0.56, 0.8], [0.16, 0.84, 0.9], [0.77, 0.2, 0.85], [0.78, 0.52, 0.9], [0.75, 0.84, 0.75]];
    c.lineCap = "round"; c.lineJoin = "round";
    spots.forEach(([fx, fy, sc], i) => {
      const S = h * 0.075 * sc;                    // x-height of the handwriting
      let px = x + w * fx - S * 1.2, py = y + h * fy;
      c.save(); c.translate(px, py); c.transform(1, 0, -0.25, 1, 0, 0);   // italic slant
      c.strokeStyle = hexA(inks[i % inks.length], 0.85); c.lineWidth = Math.max(0.6, h * 0.01);
      c.beginPath(); c.moveTo(0, 0);
      let cx2 = 0;
      // a capital-like opening stroke, then a run of joined letters of varying height
      c.bezierCurveTo(S * 0.1, -S * 2.2, S * 0.9, -S * 2.1, S * 0.5, -S * 0.2);
      cx2 = S * 0.5;
      const n = 4 + Math.floor(R() * 3);
      for (let j = 0; j < n; j++) {
        const tall = R() < 0.25, wd = S * (0.45 + R() * 0.35), ht = S * (tall ? 1.9 : 0.9 + R() * 0.3);
        c.bezierCurveTo(cx2 + wd * 0.15, -ht, cx2 + wd * 0.65, -ht, cx2 + wd * 0.55, -ht * 0.2);
        c.bezierCurveTo(cx2 + wd * 0.5, S * 0.15, cx2 + wd * 0.9, S * 0.1, cx2 + wd, -S * 0.1);
        cx2 += wd;
      }
      c.bezierCurveTo(cx2 + S * 0.4, -S * 0.3, cx2 + S * 0.8, S * 0.2, cx2 + S * 1.2, -S * 0.2);   // trailing flourish
      c.stroke();
      c.restore();
    });

    c.fillStyle = "#0c0e12"; c.beginPath(); c.arc(cx, cy, r * 1.05, 0, 7); c.fill();
    c.strokeStyle = "rgba(255,255,255,.32)"; c.lineWidth = Math.max(0.6, h * 0.007);
    c.beginPath(); c.arc(cx, cy, r, 0, 7); c.stroke();
    c.strokeStyle = "rgba(210,212,218,.5)"; c.lineWidth = Math.max(0.8, h * 0.012);
    c.beginPath();
    for (let k = 0; k <= 60; k++) {
      const t = k / 60, px = cx + (t - 0.5) * r * 1.62, py = cy + r * 0.24 * Math.sin(t * Math.PI * 2.5 + 2.18);
      k ? c.lineTo(px, py) : c.moveTo(px, py);
    }
    c.stroke();
    c.fillStyle = "#e8e8ec"; c.font = `400 ${r * 0.17}px ${FONT}`; spacing(c, `${r * 0.1}px`); c.textAlign = "center";
    c.fillText("ONCE", cx + r * 0.05, cy + r * 0.06); c.textAlign = "left"; spacing(c, "0px");
  },
  // Walldecor — a gallery wall mid-hang: some prints up, the rest still pencilled in
  walldecor(c, x, y, w, h) {
    const g = c.createLinearGradient(x, y, x, y + h); g.addColorStop(0, "#d8ccb9"); g.addColorStop(1, "#c4b59e");
    c.fillStyle = g; c.fillRect(x, y, w, h);
    c.fillStyle = "rgba(0,0,0,.05)"; c.fillRect(x, y + h * 0.88, w, h * 0.12);         // skirting
    const L = [[0.08, 0.14, 0.22, 0.56, 1], [0.34, 0.1, 0.18, 0.3, 1], [0.34, 0.46, 0.18, 0.28, 0], [0.56, 0.18, 0.26, 0.5, 1], [0.86, 0.14, 0.1, 0.24, 0], [0.86, 0.44, 0.1, 0.24, 0]];
    const arts = [["#d98f63", "#7e3f2c"], ["#9fb8c4", "#344552"], null, ["#86a88f", "#233b2c"], null, null];
    L.forEach(([fx, fy, fw, fh, done], i) => {
      const X = x + fx * w, Y = y + fy * h, FW = fw * w, FH = fh * h;
      if (done) {
        c.save(); c.shadowColor = "rgba(60,40,20,.28)"; c.shadowBlur = h * 0.05; c.shadowOffsetY = h * 0.025;
        c.fillStyle = "#1c1814"; c.fillRect(X, Y, FW, FH); c.restore();
        const b = Math.max(1, h * 0.012), m = Math.min(FW, FH) * 0.12;
        c.fillStyle = "#faf6ee"; c.fillRect(X + b, Y + b, FW - b * 2, FH - b * 2);
        const ag = c.createLinearGradient(X, Y, X + FW * 0.4, Y + FH); ag.addColorStop(0, arts[i][0]); ag.addColorStop(1, arts[i][1]);
        c.fillStyle = ag; c.fillRect(X + b + m, Y + b + m, FW - 2 * (b + m), FH - 2 * (b + m));
        if (i === 0) { c.fillStyle = "rgba(255,238,215,.85)"; c.beginPath(); c.arc(X + FW / 2, Y + FH * 0.42, FW * 0.13, 0, 7); c.fill(); }
      } else {                                   // pencilled outline, still to be hung
        c.save(); c.setLineDash([h * 0.03, h * 0.022]); c.strokeStyle = "rgba(90,70,50,.45)"; c.lineWidth = Math.max(0.6, h * 0.008);
        c.strokeRect(X, Y, FW, FH); c.restore();
        c.strokeStyle = "rgba(90,70,50,.3)"; c.lineWidth = Math.max(0.5, h * 0.005);
        c.beginPath(); c.moveTo(X + FW / 2 - h * 0.02, Y - h * 0.04); c.lineTo(X + FW / 2 + h * 0.02, Y - h * 0.04); c.stroke();
      }
    });
    c.fillStyle = "rgba(90,70,50,.55)"; c.font = `600 ${h * 0.05}px ${FONT}`; spacing(c, "0.16em");
    c.fillText("IN PROGRESS", x + w * 0.08, y + h * 0.83); spacing(c, "0px");
  }
};

/* ---------- layout: the work flows as one block of big type, like a sentence ---------- */
function nameWidth(c, text, f) { c.font = `600 ${f}px ${FONT}`; spacing(c, "-0.05em"); const w = c.measureText(text).width; spacing(c, "0px"); return w; }
function supWidth(c, text, ms) { c.font = `500 ${ms}px ${MONO}`; spacing(c, "0.08em"); const w = c.measureText(text).width; spacing(c, "0px"); return w; }

// greedy line breaking; a name and its preview stay together unless the screen is too narrow
function flow(f, availW, split) {
  const c = fctx; c.setTransform(1, 0, 0, 1, 0, 0);
  const gap = f * 0.3, glue = f * 0.16;
  const ms = Math.max(9, Math.min(13, f * 0.1));
  const lines = [[]]; let x = 0, widest = 0;
  const push = (kind, u, w) => { lines[lines.length - 1].push({ kind, u, x, w }); x += w; };
  const newLine = () => { lines.push([]); x = 0; };
  WORK.forEach(item => {
    const nameW = nameWidth(c, item.title, f);
    const th = f * 0.66, tw = th * 1.72, dot = f * 0.17, dgap = f * 0.15;
    const u = { item, nameW, th, tw, dot, dgap, a: nameW, b: tw + dgap + dot };
    widest = Math.max(widest, u.a + glue + u.b);
    const lead = x > 0 ? gap : 0;
    if (x + lead + u.a + glue + u.b <= availW) { x += lead; push("name", u, u.a); x += glue; push("thumb", u, u.b); return; }
    if (split && x + lead + u.a <= availW) { x += lead; push("name", u, u.a); newLine(); push("thumb", u, u.b); return; }
    if (x > 0) newLine();
    push("name", u, u.a);
    if (u.a + glue + u.b <= availW) { x += glue; push("thumb", u, u.b); } else { newLine(); push("thumb", u, u.b); }
  });
  return { lines: lines.filter(l => l.length), widest };
}

function layout() {
  const narrow = W < 700;
  const side = narrow ? 16 : Math.max(24, Math.round(W * 0.03));
  const top = narrow ? 88 : 104, bottom = narrow ? 76 : 88;
  const availW = W - side * 2, availH = H - top - bottom;
  // largest type size whose flow still fits the screen (the v7 fitText idea, applied to the whole block)
  let lo = 18, hi = Math.min(availH * 0.36, 260), best = null;
  for (let i = 0; i < 24; i++) {
    const f = (lo + hi) / 2, L = flow(f, availW, false);
    if (L.lines.length * f * 1.04 <= availH && L.widest <= availW) { lo = f; best = { f, L }; } else hi = f;
  }
  if (!best) best = { f: lo, L: flow(lo, availW, false) };
  const { f, L } = best, n = L.lines.length, cap = f * 0.71;
  const lh = Math.min(availH / n, f * (narrow ? 1.75 : 1.3)), y0 = top + (availH - lh * n) / 2;
  rows = [];
  const byItem = new Map();
  L.lines.forEach((line, li) => {
    const base = y0 + li * lh + lh * 0.5 + cap * 0.5;
    const last = line[line.length - 1], used = last.x + last.w;
    let breaks = 0; line.forEach((p, i) => { if (i > 0 && p.kind === "name") breaks++; });
    const extra = availW - used, limit = li < n - 1 ? f * 1.6 : f * 0.9;
    const per = breaks > 0 && extra / breaks <= limit ? extra / breaks : 0;   // justify when the gaps stay honest
    let shift = 0;
    line.forEach((p, i) => {
      if (i > 0 && p.kind === "name") shift += per;
      const px = side + p.x + shift, u = p.u;
      let r = byItem.get(u.item);
      if (!r) { r = { item: u.item, u, f, cap, rects: [] }; byItem.set(u.item, r); rows.push(r); }
      if (p.kind === "name") {
        r.name = { x: px, base, w: u.nameW };
        r.rects.push({ x: px, y: base - cap - f * 0.16, w: p.w, h: cap + f * 0.36 });
      } else {
        r.thumb = { x: px, y: base - cap * 0.5 - u.th / 2, w: u.tw, h: u.th };
        r.dot = { x: px + u.tw + u.dgap + u.dot / 2, y: base - cap * 0.5, r: u.dot / 2 };
        r.rects.push({ x: px, y: r.thumb.y, w: u.b, h: u.th });
      }
    });
  });
  rows.forEach(r => { r.fx = r.name.x + r.name.w / 2; r.fy = r.name.base - cap * 0.5; });
}
function rowAt(x, y) { return rows.find(r => r.rects.some(q => x >= q.x - 10 && x <= q.x + q.w + 10 && y >= q.y - 10 && y <= q.y + q.h + 10)) || null; }

function drawRow(c, r) {
  const { item, f, u } = r;
  c.font = `600 ${f}px ${FONT}`; spacing(c, "-0.05em");
  c.fillStyle = "#f2f2ef";
  c.fillText(item.title, r.name.x - f * 0.03, r.name.base); spacing(c, "0px");
  const t = r.thumb, rad = t.h * 0.28;

  document.body.classList.toggle("is-index", show);
  btnIndex.setAttribute("aria-pressed", String(show));
  if (show) {
    spawnHold = false;
    btnBack.classList.remove("sink");
    indexEl.hidden = false;
    indexEl.getBoundingClientRect();
    requestAnimationFrame(() => indexEl.classList.add("shown"));
    btnBack.hidden = false;
    focusIfKeyboard(indexEl.querySelector("button"));
  } else {
    indexEl.classList.remove("shown");
    btnBack.classList.add("sink");
    if (toCanvas && glOK) {
      // park the drop, invisible, where the pointer is; it grows back once the index is gone
      const [px, py] = lastMouse || [ox ?? W / 2, oy ?? H / 2];
      drop.ax = drop.bx = drop.tx = px; drop.ay = drop.by = drop.ty = py;
      drop.avx = drop.avy = drop.bvx = drop.bvy = 0;
      drop.r = 0; drop.rv = 0; drop.seg = drop.segT = 0; drop.segV = 0;
      hi.amt = 0;
      spawnHold = true;
    }
    let done = false;
    const finish = () => {
      if (done) return; done = true;
      indexEl.removeEventListener("transitionend", onEnd);
      indexEl.hidden = true; btnBack.hidden = true; btnBack.classList.remove("sink");
      // wait one frame so the canvas is on screen before the drop starts to grow
      requestAnimationFrame(() => { spawnHold = false; lastInput = performance.now(); lastT = performance.now(); kick(); });
    };
    const onEnd = (e) => { if (e.target === indexEl && e.propertyName === "clip-path") finish(); };
    indexEl.addEventListener("transitionend", onEnd);
    indexTimer = setTimeout(finish, reduced ? 0 : 780);
    if (!openRow) focusIfKeyboard(btnIndex);
  }
  kick();
}
function centre(el) { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; }
btnIndex.addEventListener("click", () => { if (glOK && indexEl.hidden) toggleIndex(true, ...centre(btnIndex)); });
$("#btnBack").addEventListener("click", () => toggleIndex(false, ...centre($("#btnBack"))));
btnAbout.addEventListener("click", () => { if (!indexEl.hidden) toggleIndex(false, undefined, undefined, false); if (openRow) close(); open(ABOUT); });

/* ============================== BOOT ============================== */
function resize() {
  W = innerWidth; H = innerHeight;
  const dpr = Math.min(devicePixelRatio || 1, 2);
  cvs.width = Math.round(W * dpr); cvs.height = Math.round(H * dpr);
  layout();
  if (glOK) { buildField(gl.getParameter(gl.MAX_TEXTURE_SIZE)); uploadTextures(); }
  if (openRow && gal.phase && gal.row) { galRelayout(); openRow = gal.row; }
  else if (openRow) { const r = openRow.item === ME ? ABOUT : rows.find(x => x.item === openRow.item); openRow = null; open(r); }
  else if (gal.phase) galRelayout();
  kick();
}

async function boot() {
  buildIndex();
  const fonts = [`600 60px Geist`, `700 20px Geist`, `500 12px Geist`];
  try { await Promise.race([Promise.all([...fonts.map(f => document.fonts.load(f, "PRMřČé")), loadAssets()]), new Promise(r => setTimeout(r, 3000))]); } catch (_) {}
  if (glOK) { try { initGL(); } catch (err) { console.error(err); glOK = false; } }
  if (!glOK) {
    $("#nogl").hidden = false; cvs.hidden = true; hint.hidden = true;
    indexEl.hidden = false; indexEl.classList.add("shown"); btnIndex.hidden = true; layout(); return;
  }
  W = innerWidth; H = innerHeight; layout();
  const start = phone ? { fx: W / 2, fy: H / 2 } : rows[0];
  drop.ax = drop.bx = drop.tx = start.fx; drop.ay = drop.by = drop.ty = start.fy;
  const ft = focusTargets(); drop.r = ft.r; drop.mag = ft.mag;
  booted = true;
  resize();
  if (reduced) toggleIndex(true, W - 60, 40);
  let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(resize, 140); });
  setTimeout(loadReel, 1500);                        // the table's frames arrive quietly in the background
  if (document.fonts && document.fonts.addEventListener) document.fonts.addEventListener("loadingdone", () => { if (glOK) { layout(); buildField(gl.getParameter(gl.MAX_TEXTURE_SIZE)); uploadTextures(); kick(); } });
}
boot();
})();
